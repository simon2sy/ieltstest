        var parts = s.split(/,\s+(and|but|which|so)\s+/i);
        if (parts.length >= 3) {
          var a = parts[0] + "."; var b = parts[2].charAt(0).toUpperCase() + parts[2].slice(1);
          rewrites.push({ type: "Sentence splitting", before: s, after: a + " In addition, " + b, why: "A 40+ word sentence usually contains two ideas. Splitting them improves Coherence and Cohesion and reduces the chance of a grammar slip being counted against you." });
        }
      }
    });
    st.repeated.slice(0, 2).forEach(function (r) {
      var alt = WritingEval.THESAURUS[r.word];
      if (!alt) return;
      var sent = GramCheck.sentences(text).filter(function (s) { return new RegExp("\\b" + r.word, "i").test(s); })[0];
      if (!sent) return;
      var variants = alt.split(",").map(function (x) { return x.trim(); });
      rewrites.push({
        type: "Lexical replacement", before: sent,
        after: sent.replace(new RegExp("\\b" + r.word + "\\b", "i"), variants[0]),
        why: "'" + r.word + "' appears " + r.n + " times. Replacing one occurrence with '" + variants[0] + "' (or " + variants.slice(1).join(", ") + ") demonstrates lexical range without repeating a memorised word."
      });
    });
    /* weak phrase → precise alternative, expressed as a rewritten sentence */
    st.weak.slice(0, 3).forEach(function (x) {
      var sent = GramCheck.sentences(text).filter(function (s) { return new RegExp("\\b" + x.phrase + "\\b", "i").test(s); })[0];
      if (!sent) return;
      var better = sent.replace(new RegExp("\\b" + x.phrase + "\\b", "gi"), x.better[0]);
      better = GramCheck.autoFix(better);
      if (better !== sent && rewrites.length < 8) {
        rewrites.push({
          type: "Imprecision",
          before: sent,
          after: better,
          why: "'" + x.phrase + "' appears " + x.n + " time(s). '" + x.better[0] + "' is more precise, so the sentence carries more information per word — which is exactly what the Lexical Resource criterion measures. Compare: 'a lot of people' states a vague quantity, whereas '" + x.better[0] + " people' commits to a scale."
        });
      }
    });
    rewrites = rewrites.slice(0, 8);

    /* top actions ranked by band impact */
    var actions = [];
    if (w < task.minWords) actions.push({ p: 1, text: "Add " + (task.minWords + 30 - w) + " words. Under-length answers lose Task Response marks regardless of quality — one extra developed example is usually enough." });
    st.tr.checks.filter(function (c) { return !c.ok; }).forEach(function (c, i) { actions.push({ p: Math.min(3, i + 1), text: "Fix: " + c.k + " — " + c.detail }); });
    if (st.weak.length) actions.push({ p: 2, text: "Replace " + st.weak.slice(0, 3).map(function (x) { return "'" + x.phrase + "'"; }).join(", ") + " with the precise alternatives listed below." });
    if (st.repeatedOpeners.length) actions.push({ p: 3, text: "Vary sentence openings: '" + st.repeatedOpeners[0].opener + "' starts " + st.repeatedOpeners[0].n + " sentences." });
    if (st.errors.length) actions.push({ p: 2, text: "Correct the " + st.errors.length + " flagged accuracy issues — they cost you directly in Grammatical Range and Accuracy." });

    return {
      stats: st, criteria: crit, overall: overall,
      corrections: corrections, upgrades: upgrades, rewrites: rewrites,
      actions: actions.sort(function (a, b) { return a.p - b.p; }).slice(0, 5),
      words: w,
      bandNote: overall >= 8 ? "This estimate is in the Band 8+ range. The rubric engine separates bands reliably up to about Band 7.5; above that it cannot reliably distinguish an 8 from a 9, so treat this as 'Band 8+' rather than a precise figure." : null,
      disclaimer: "Estimated IELTS Band — produced by automated rubric analysis, not by a trained examiner. Use it for practice guidance only. Estimates are typically accurate to within about half a band in the 5.0–7.5 range."
    };
  }
};

/* ---------------------------- speaking engine --------------------------- */
var SpeakingEval = {
  FILLERS: ["um", "uh", "er", "erm", "ah", "like", "you know", "i mean", "basically", "actually", "sort of", "kind of", "well"],
  LINKERS: ["so", "because", "but", "and", "however", "although", "which", "that's why", "for example", "on the other hand", "i suppose", "to be honest", "generally speaking"],
  evaluate: function (input) {
    var transcript = String(input.transcript || "");
    var cue = input.cueCard || "";
    var seconds = input.seconds || 0;
    var words = countWords(transcript);
    var lower = transcript.toLowerCase();
    var sentences = GramCheck.sentences(transcript);
    var tokens = lower.match(/[a-z']+/g) || [];
    var utterances = transcript.split(/\n+/).filter(function (x) { return countWords(x) > 2; });
    var minutes = Math.max(0.15, seconds / 60);
    var wpm = seconds > 5 ? Math.round(words / minutes) : null;

    /* filler + hesitation analysis */
    var fillerHits = [];
    this.FILLERS.forEach(function (f) {
      var re = new RegExp("\\b" + f.replace(/ /g, "\\s+") + "\\b", "gi");
      var m = lower.match(re);
      if (m) fillerHits.push({ filler: f, n: m.length });
    });
    fillerHits.sort(function (a, b) { return b.n - a.n; });
    var fillerTotal = fillerHits.reduce(function (a, b) { return a + b.n; }, 0);
    var fillerRate = words ? fillerTotal / words : 0;

    /* repetition */
    var content = tokens.filter(function (w) { return w.length > 3 && GramCheck.STOW.indexOf(w) === -1; });
    var rep = sortBy(Object.keys(groupBy(content, function (w) { return w; })).map(function (w) {
      return { word: w, n: content.filter(function (x) { return x === w; }).length };
    }), function (r) { return -r.n; }).filter(function (r) { return r.n >= 3; }).slice(0, 8);

    /* self-correction & repairs */
    var repairs = (lower.match(/\b(i mean|sorry|rather|let me rephrase|what i meant|actually not)\b/g) || []).length;
    var ttrUnique = Object.keys(groupBy(content, function (w) { return w.replace(/(s|es|ing|ed)$/, ""); }));
    var rootTTR = content.length ? round1((ttrUnique.length / Math.sqrt(content.length)) * 100) / 100 : 0;
    var mlr = utterances.length ? round1(mean(utterances.map(countWords))) : (sentences.length ? round1(mean(sentences.map(countWords))) : 0);
    var subord = WritingEval.SUBORDINATORS.filter(function (m) { return new RegExp("\\b" + m.replace(/ /g, "\\s+"), "i").test(lower); });
    var linkers = this.LINKERS.filter(function (m) { return new RegExp("\\b" + m.replace(/ /g, "\\s+"), "i").test(lower); });
    var tenseVariety = ["is", "are", "was", "were", "have", "had", "would", "will", "can", "could"].filter(function (t) { return new RegExp("\\b" + t + "\\b", "i").test(lower); }).length;
    var errors = GramCheck.check(transcript);
    var errorRate = words ? round1((errors.length / words) * 100) : 0;

    /* topic relevance to the cue card */
    var cueWords = ((cue + " " + (input.bullets || []).join(" ")).toLowerCase().match(/[a-z]{4,}/g) || []).filter(function (w) { return GramCheck.STOW.indexOf(w) === -1; });
    var cueCovered = Object.keys(groupBy(cueWords, function (w) { return w; })).filter(function (w) { return lower.indexOf(w.slice(0, Math.max(4, w.length - 2))) > -1; });
    var relevance = cueWords.length ? cueCovered.length / Object.keys(groupBy(cueWords, function (w) { return w; })).length : 0.6;

    /* rehearsed-answer detector */
    var rehearsedSignals = 0;
    if (fillerTotal === 0 && words > 120) rehearsedSignals++;
    if (repairs === 0 && words > 150) rehearsedSignals++;
    if (rootTTR > 8.2 && words > 130) rehearsedSignals++;

    /* criteria bands */
    var fc = 5.0;
    if (wpm != null) {
      var pace = wpm >= 110 && wpm <= 175 ? 1 : wpm >= 90 && wpm <= 200 ? 0.6 : 0.25;
      var fill = fillerRate <= 0.03 ? 1 : fillerRate <= 0.06 ? 0.7 : fillerRate <= 0.1 ? 0.4 : 0.15;
      var mlrScore = mlr >= 12 ? 1 : mlr >= 8 ? 0.7 : mlr >= 5 ? 0.4 : 0.2;
      fc = mean([pace, fill, mlrScore, Math.min(1, linkers.length / 5)]);
    } else {
      fc = mean([Math.min(1, words / 180), fillerRate <= 0.05 ? 0.9 : 0.5, Math.min(1, mlr / 12), Math.min(1, linkers.length / 5)]);
    }
    var lrScore = mean([Math.min(1, rootTTR / 8.5), Math.min(1, relevance / 0.8), rep.length > 4 ? 0.5 : rep.length > 2 ? 0.7 : 0.95, Math.min(1, (words / 140))]);
    var graScore = mean([Math.min(1, subord.length / 5), Math.min(1, tenseVariety / 6), clamp(1 - errorRate / 9, 0, 1), Math.min(1, mlr / 12)]);
    var pronScore = mean([Math.min(1, words / 150), clamp(1 - errorRate / 12, 0, 1), Math.min(1, (mlr + linkers.length) / 14)]);
    var toBand = function (s, cap) { var b = s >= 0.95 ? 9 : s >= 0.85 ? 8 : s >= 0.7 ? 7 : s >= 0.55 ? 6 : s >= 0.4 ? 5 : 4; return cap ? Math.min(b, cap) : b; };
    var cap = words < 60 ? 5.0 : words < 100 ? 6.0 : undefined;
    var crit = [
      { name: "Fluency and Coherence", band: toBand(fc, cap), why: (wpm != null ? "Speech rate approximately " + wpm + " words per minute (a comfortable IELTS range is about 110–170). " : "No timing data captured, so fluency is judged from the transcript only. ") + "Filled pauses: " + fillerTotal + " (" + pct(fillerRate) + "% of words). Mean length of run: " + mlr + " words. Cohesive markers used: " + linkers.length + "." },
      { name: "Lexical Resource", band: toBand(lrScore, cap), why: "Lexical variety index " + rootTTR + ", topic coverage of the cue card " + pct(relevance) + "%. " + (rep.length ? "Repeated content words: " + rep.slice(0, 5).map(function (r) { return r.word + "×" + r.n; }).join(", ") + ". " : "") + (fillerHits.length ? "Most-used filler: '" + fillerHits[0].filler + "' (" + fillerHits[0].n + " times) — examiners hear this as vocabulary avoidance." : "") },
      { name: "Grammatical Range and Accuracy", band: toBand(graScore, cap), why: "Subordinating structures: " + subord.length + " (" + (subord.slice(0, 5).join(", ") || "few") + "). Tense/aspect variety: " + tenseVariety + " forms. Flagged grammar issues: " + errors.length + " (" + errorRate + " per 100 words)." },
      { name: "Pronunciation", band: toBand(pronScore, cap), why: "Limited evidence: pronunciation cannot be assessed accurately from a transcript. This estimate is based on intelligibility proxies (length, structural clarity, word-level accuracy). Record your answers and listen for word stress and final consonants — that self-check is more reliable than this number." }
    ];
    var overall = words < 25 ? null : roundHalf(mean(crit.map(function (c) { return c.band; })));

    /* suggested improved answers from the student's own words */
    var improvements = [];
    if (rep.length) improvements.push({ type: "Vocabulary upgrade", before: "you repeated '" + rep[0].word + "' " + rep[0].n + " times", after: "use " + (WritingEval.THESAURUS[rep[0].word] || "a synonym such as 'significant', 'notable'"), why: "Repetition is the fastest way examiners hear a limited vocabulary. Varying one word lifts Lexical Resource without adding new grammar." });
    if (fillerTotal) improvements.push({ type: "Filler reduction", before: "Replace '" + fillerHits[0].filler + "' with a short thinking device", after: "That's an interesting question — I suppose… / Well, the first thing that comes to mind is…", why: "Linking phrases hold the floor while you think, and unlike 'um' they count as cohesion, so they earn credit rather than costing you." });
    if (mlr < 10 && sentences.length) improvements.push({ type: "Extend short answers", before: sentences[0].slice(0, 90), after: sentences[0] + " The reason I say that is that …, and in my experience …", why: "Answers of fewer than 10 words give the examiner nothing to assess. Adding 'because' plus an example doubles the evidence available for your band." });
    if (subord.length < 3) improvements.push({ type: "Add complex structures", before: "Simple sentences dominate", after: "Use 'although …', 'which means …', 'if … then …' at least twice per answer", why: "Grammatical Range is scored on variety, not only accuracy. Two subordinate clauses per answer is often the difference between Band 6 and Band 7." });
    if (errors.length) improvements.push({ type: "Accuracy fixes", before: errors.slice(0, 2).map(function (e) { return e.match; }).join(", "), after: errors.slice(0, 2).map(function (e) { return e.suggestion || e.message; }).join("; "), why: "Recurring small errors are counted across the whole test, so fixing two repeated patterns can move accuracy a full half band." });

    return {
      criteria: crit, overall: overall, words: words, wpm: wpm,
      fillerHits: fillerHits, fillerTotal: fillerTotal, fillerRate: fillerRate,
      repetitions: rep, repairs: repairs, mlr: mlr, subordinators: subord, linkers: linkers,
      errors: errors, improvements: improvements, rehearsed: rehearsedSignals >= 2,
      disclaimer: "Estimated IELTS Band — automated estimate from a transcript, not an examiner's judgement. Pronunciation in particular cannot be scored reliably without acoustic analysis."
    };
  }
};

/* ----------------------------- vocabulary SRS --------------------------- */
var Vocab = {
  all: function () { return window.BANK_VOCAB.words; },
  find: function (w) { return this.all().filter(function (x) { return x.word === w; })[0]; },
  saved: function () { return Store.get().vocab.saved || []; },
  isSaved: function (w) { return this.saved().indexOf(w) > -1; },
  toggle: function (w) {
    var s = Store.get(); var i = s.vocab.saved.indexOf(w);
    if (i > -1) s.vocab.saved.splice(i, 1); else s.vocab.saved.push(w);
    Store.save(); return this.isSaved(w);
  },
  due: function () {
    var srs = Store.get().vocab.srs || {}, now = Date.now(),
      saved = (Store.get().vocab.saved || []);
    return saved.filter(function (w) { var c = srs[w]; return !c || !c.dueAt || c.dueAt <= now; });
  },
  queue: function () {
    var due = this.due().map(function (w) { return Vocab.find(w); }).filter(Boolean);
    var rest = this.all().filter(function (w) { return Vocab.isSaved(w.word) && due.indexOf(w) === -1; });
    return due.concat(sample(rest, Math.max(0, 10 - due.length)));
  },
  grade: function (w, g) {  /* g: 1 again, 2 hard, 3 good, 4 easy */
    var s = Store.get(), srs = s.vocab.srs;
    var c = srs[w] || { ease: 2.5, intervalDays: 0, reps: 0, lapses: 0 };
    if (g === 1) { c.intervalDays = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.lapses++; }
    else {
      c.ease = clamp(c.ease + (g === 4 ? 0.15 : g === 3 ? 0 : -0.15), 1.3, 3.0);
      c.intervalDays = c.reps === 0 ? (g === 2 ? 1 : 2) : Math.max(1, Math.round(c.intervalDays * c.ease * (g === 2 ? 0.6 : 1)));
      c.reps++;
    }
    c.dueAt = Date.now() + c.intervalDays * 86400000;
    srs[w] = c;
    if (s.vocab.learned.indexOf(w) === -1) s.vocab.learned.push(w);
    Store.save();
  }
};

          (a.length ? "Your Listening accuracy by type: " + a.map(function (t) { return t.label + " " + pct(t.accuracy) + "%"; }).join(" · ") : "Complete a Listening test and I will break accuracy down by question type.");
      }
    },
    {
      id: "reading",
      match: /(reading|skim|scan|time management|heading)/i,
      answer: function () {
        return "**Reading strategy by question order**\n\n" +
          "• Passage 1 (13 questions, ~17 min): bank the marks. Answers follow passage order.\n" +
          "• Passage 2: matching tasks do NOT follow order. Locate first, answer second.\n" +
          "• Passage 3: expect opinion language. Before choosing an MCQ option, mark each one as true-in-passage or answers-the-question.\n\n" +
          "Time budget: 17 / 20 / 23 minutes. If you spend over 90 seconds on one question, flag it, guess with a reason, and return at the end.\n\n" +
          (Analytics.weakTypes(2)[0] ? "Your weakest type right now is " + Analytics.weakTypes(2)[0].label + "." : "");
      }
    }
  ],
  ask: function (q) {
    var text = String(q || "").trim();
    if (!text) return { answer: "Ask me anything about your preparation, your scores, or a question you got wrong.", actions: [] };
    for (var i = 0; i < this.intents.length; i++) {
      if (this.intents[i].match.test(text)) return { answer: this.intents[i].answer.call(this.intents[i]), id: this.intents[i].id, actions: [] };
    }
    /* generic, data-aware fallback */
    var b = Analytics.bands(), p = Store.get().profile;
    var s = "Here is where you stand, based on your own attempt data:\n\n" +
      SKILLS.map(function (k) { return "• " + k.charAt(0).toUpperCase() + k.slice(1) + ": " + (b[k] == null ? "not yet estimated" : b[k].toFixed(1)); }).join("\n") +
      (b.overall ? "\n• Overall estimate: " + b.overall.toFixed(1) : "") +
      "\n• Target: " + p.targetBand.toFixed(1) + " · Exam: " + p.examDate + "\n\n" +
      "I can help with specific questions, for example:\n" +
      "• \"Why is this answer False instead of Not Given?\"\n" +
      "• \"How can I improve from Band 6.5 to 7.5?\"\n" +
      "• \"Practice my weak areas\"\n" +
      "• \"Explain this grammar mistake\"\n• \"Give me a Part 2 speaking question\"";
    return { answer: s, actions: [] };
  }
};

var App = {

/* ---------------------------- listening audio --------------------------- */
var Listening = {
  playing: false, cancelled: false, voices: [],
  loadVoices: function () {
    if (!window.speechSynthesis) return;
    this.voices = window.speechSynthesis.getVoices() || [];
  },
  available: function () { return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); },
  pick: function (accent, sp) {
    if (!this.voices.length) this.loadVoices();
    var v = this.voices;
    var want = /british|uk|gb/i.test(accent) ? /en(-|_)GB/i : /austral/i.test(accent) ? /en(-|_)AU/i :
      /scottish/i.test(accent) ? /en(-|_)GB/i : /indian/i.test(accent) ? /en(-|_)IN/i : /american|us/i.test(accent) ? /en(-|_)US/i : null;
    var cands = v.filter(function (x) { return /^en/i.test(x.lang); });
    var found = want ? cands.filter(function (x) { return want.test(x.lang) || want.test(x.name); }) : [];
    if (!found.length) found = cands;
    if (!found.length) return null;
    /* distribute speakers across available voices so lines sound distinct */
    var h = 0; for (var i = 0; i < String(sp).length; i++) h += String(sp).charCodeAt(i);
    return found[h % found.length];
  },
  play: function (section, rate, onLine, onDone) {
    var self = this;
    if (!this.available()) { toast("Speech synthesis is unavailable in this browser — use Reveal transcript."); if (onDone) onDone(); return; }
    this.stop();
    this.playing = true; this.cancelled = false;
    var i = 0;
    function next() {
      if (self.cancelled || i >= section.transcript.length) {
        self.playing = false;
        var st = $("#audio-state"); if (st) st.textContent = "finished";
        if (onDone) onDone();
        return;
      }
      var line = section.transcript[i];
      var u = new SpeechSynthesisUtterance(line.line);
      var v = self.pick(section.accent.join(","), line.sp);
      if (v) u.voice = v;
      u.rate = rate || 1;
      u.pitch = /female|caller|priya|receptionist|presenter|tutor|anna/i.test(line.sp) ? 1.06 : 0.92;
      u.onend = function () { if (onLine) onLine(i); i++; setTimeout(next, 260); };
      u.onerror = function () { i++; setTimeout(next, 200); };
      var st = $("#audio-state"); if (st) st.textContent = "playing " + (i + 1) + "/" + section.transcript.length;
      try { window.speechSynthesis.speak(u); } catch (e) { self.playing = false; toast("Audio could not start: " + e.message); }
    }
    next();
  },
  stop: function () {
    this.cancelled = true; this.playing = false;
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { }
    var st = $("#audio-state"); if (st) st.textContent = "stopped";
  }
};

function recordAttempt(test, results) {
  var s = Store.get(), p = s.profile;
  var attempt = {
    id: uid("att"), ts: Date.now(), mode: test.mode, skill: test.skill, module: test.module,
    testId: test.id, title: test.title, raw: results.raw, outOf: results.outOf,
    band: results.band, accuracy: results.accuracy, timeSpentSec: App.timer.elapsed,
    durationPlannedSec: test.durationSec, timed: test.timed, bandTarget: test.bandTarget,
    breakdown: results.breakdown,
    setKey: test.setKey || null, setNumber: test.setNumber || null
  };
  s.attempts.push(attempt);
  results.detail.forEach(function (d) {
    if (!d.answered && d.skipped) return;
    s.responses.push({
      attemptId: attempt.id, questionId: d.item.id, skill: d.item.skill, type: d.item.type,
      topic: d.item.topic, difficulty: d.item.difficulty, bandLevel: d.item.bandLevel,
      userAnswer: d.user, correct: d.correct, timeMs: 0,
      attemptNumber: s.responses.filter(function (r) { return r.questionId === d.item.id; }).length + 1
    });
    s.seen[d.item.id] = Date.now();
  });
  Store.save();
  return attempt;
}
function scoreTest(test, answers) {
  var detail = [], byType = {};
  test.items.forEach(function (it) {
    var user = String(answers[it.id] == null ? "" : answers[it.id]).trim();
    var r = checkObjective(user, it);
    detail.push({ item: it, user: user, correct: !!r.correct, note: r.note, over_limit: r.over_limit, answered: !!user });
    var k = it.type;
    byType[k] = byType[k] || { type: k, label: TYPELABEL[k] || k, correct: 0, total: 0 };
    byType[k].total++;
    if (r.correct) byType[k].correct++;
  });
  var raw = detail.filter(function (d) { return d.correct; }).length;
  var outOf = test.items.length;
  var skill = test.skill === "mixed" ? "reading" : test.skill;
  var res = {
    raw: raw, outOf: outOf, accuracy: outOf ? raw / outOf : 0,
    band: rawToBand(raw, outOf, skill, test.module),
    breakdown: Object.keys(byType).map(function (k) { return byType[k]; }).sort(function (a, b) { return (a.correct / a.total) - (b.correct / b.total); }),
    detail: detail,
    readingBand: null, listeningBand: null
  };
  if (test.skill === "mixed") {
    var ri = detail.filter(function (d) { return d.item.skill === "reading"; });
    var li = detail.filter(function (d) { return d.item.skill === "listening"; });
    res.readingBand = ri.length ? rawToBand(ri.filter(function (d) { return d.correct; }).length, ri.length, "reading", test.module) : null;
    res.listeningBand = li.length ? rawToBand(li.filter(function (d) { return d.correct; }).length, li.length, "listening", test.module) : null;
    res.rawBySkill = { reading: [ri.filter(function (d) { return d.correct; }).length, ri.length], listening: [li.filter(function (d) { return d.correct; }).length, li.length] };
  }
  return res;
}

function explanationHTML(d) {
  var it = d.item, ex = it.ex || {};
  var yours = !d.answered ? "(not answered)" : esc(d.user);
  return '<div class="qcard"><div class="qhead"><span class="qnum">' + it.number + '</span>' +
    '<span class="chip ' + (d.correct ? "green" : "rose") + '">' + (d.correct ? "Correct" : "Incorrect") + "</span>" +
    '<span class="chip grey">' + esc(TYPELABEL[it.type] || it.type) + "</span>" +
    '<span class="chip violet">' + esc(it.bandLevel || it.difficulty) + "</span>" +
    '<div class="spacer"></div><span class="small muted">' + esc(it.source) + "</span></div>" +
    '<div class="qprompt">' + esc(it.prompt) + "</div>" +
    '<div class="row tight"><span class="chip ' + (d.correct ? "green" : "rose") + '">Your answer: ' + yours + "</span>" +
    '<span class="chip green">Correct answer: ' + esc(it.answer) + "</span>" +
    (d.note ? '<span class="chip amber">' + esc(d.note) + "</span>" : "") +
    ((it.accepted || []).length ? '<span class="chip grey">Also accepted: ' + esc(it.accepted.join(" / ")) + "</span>" : "") + "</div>" +
    '<div class="explain">' +
    [["What was tested", ex.test], ["Where the answer was", ex.where], ["Evidence", ex.quote ? "QUOTE" : ""], ["Why it is correct", ex.why],
    ["Why your answer was wrong", ex.mine], ["The trap", ex.trap], ["Next time", ex.next]].map(function (row) {
      if (!row[1]) return "";
      if (row[2] === "QUOTE") return '<div class="ex-row"><div class="ex-k">' + row[0] + '</div><div class="ex-v"><div class="quote">' + esc(ex.quote) + "</div></div></div>";
      return '<div class="ex-row"><div class="ex-k">' + row[0] + '</div><div class="ex-v">' + esc(row[1]) + "</div></div>";
    }).join("") +
    ((it.vocab || []).length ? '<div class="ex-row"><div class="ex-k">Related vocabulary</div><div class="ex-v">' + it.vocab.map(function (v) { return "<b>" + esc(v[0]) + "</b> — " + esc(v[1]); }).join(" · ") + "</div></div>" : "") +
    "</div>" +
    '<div class="row tight" style="margin-top:10px"><button class="btn sm" data-act="ask-about" data-q="Why is the answer to question ' + it.number + " \\\"" + esc(it.answer) + "\\\" and not what I wrote?\">Ask the tutor about this</button>" +
    '<span class="small muted">Skill tested: ' + esc(ex.test ? (ex.test.split(".")[0]) : "") + "</span></div></div>";
}

function transcriptReviewHTML(test, r) {
  /* Rejection and correction signals: in IELTS listening, distractors are almost
     always a fact the speaker then withdraws ("not five, as the old handbook says"),
     a change of direction ("actually", "rather than") or a polite refusal
     ("I'm afraid"). Marking those lines teaches the pattern rather than the answer. */
  var REJECT = /(\bnot\b|\brather than\b|\binstead of\b|i'?m afraid|\bactually\b|\bsorry\b|\bno, |\bdon'?t\b|\bdoesn'?t\b|\bisn'?t\b|\bwasn'?t\b|\bcan'?t\b|\bwon'?t\b|\bnever\b|\bexcept\b|\bunfortunately\b|\bwrong\b|\bold\b|\bno longer\b|\bcorrection\b)/i;
  var out = "";
  var sections = (test.contexts || []).filter(function (c) { return c.transcript; });
  if (!sections.length) return "";
  sections.forEach(function (sec) {
    var items = test.items.filter(function (i) { return i.ctxId === sec.id; });
    var hits = {}, dis = {}, hitIdx = [];
    items.forEach(function (it) {
      var key = String(it.answer).toLowerCase().replace(/[^a-z0-9 ]/g, "").trim();
      var words = key.split(" ").filter(function (w) { return w.length > 3; });
      if (key.length < 3 && !words.length) return;
      sec.transcript.forEach(function (l, idx) {
        var low = l.line.toLowerCase();
        var match = key.length > 3 ? (low.indexOf(key) > -1 || (words.length && words.every(function (w) { return low.indexOf(w) > -1; }))) : new RegExp("\\b" + key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b").test(low);
        if (match) { hits[idx] = hits[idx] || []; hits[idx].push(it.number); if (hitIdx.indexOf(idx) === -1) hitIdx.push(idx); }
      });
    });
    sec.transcript.forEach(function (l, idx) {
      if (hits[idx] || !REJECT.test(l.line)) return;
      var near = hitIdx.some(function (h) { return Math.abs(h - idx) <= 5; });
      if (near) dis[idx] = 1;
    });
    out += '<div class="upper" style="margin:14px 0 6px">Section ' + sec.number + " — " + esc(sec.context) + "</div>";
    sec.transcript.forEach(function (l, idx) {
      var cls = hits[idx] ? "hit" : dis[idx] ? "dist" : "";
      out += '<div class="transcript-line ' + cls + '"><div class="who">' + esc(l.sp) + "</div><div>" + esc(l.line) +
        (hits[idx] ? '<span class="tag ans">answer Q' + hits[idx].join(", ") + "</span>" : "") +
        (dis[idx] ? '<span class="tag dis">distractor signal: a fact withdrawn or corrected</span>' : "") + "</div></div>";
    });
    out += '<div class="small muted" style="margin:8px 0 4px">Highlighting is generated by matching each answer key to the script, so you can see the exact words the speaker used — and how close the distractors sat.</div>';
  });
  out += '<div class="legend" style="margin-top:10px"><span><i style="background:#fff8dc;border:1px solid #f2e0a8"></i>answer location</span><span><i style="background:#fdf2f5;border:1px solid #f6d7e0"></i>distractor signal — a fact the speaker withdrew or corrected</span><span>Spelling and word limits are part of the mark — check your answer against the exact script wording.</span></div>';
  return out;
}

function speakingReportHTML(rep, s) {
  var ban = App.speaking && App.speaking.setKey ? setBannerHTML(App.speaking.setKey, { nextAct: "next-set", nextLabel: "Next set →" }) : "";
  return '<div class="card"><div class="band-hero"><div><div class="big">' + (rep.overall == null ? "—" : rep.overall.toFixed(1)) + '</div><div class="lbl">Estimated IELTS Band — Speaking</div>' +
    '<div class="small muted" style="margin-top:4px">' + rep.words + " words · " + (rep.wpm ? rep.wpm + " words/min" : "no timing data") + " · set: " + esc(s.part1Topic) + "</div></div>" +
    '<div style="flex:1;min-width:240px">' + rep.criteria.map(function (c) {
      return '<div style="margin-bottom:9px"><div class="row" style="justify-content:space-between"><span class="small">' + esc(c.name) + '</span><span class="b">' + c.band.toFixed(1) + "</span></div><div class=\"bar " + (c.band < 6 ? "rose" : c.band < 7 ? "amber" : "teal") + '"><i style="width:' + (c.band / 9) * 100 + '%"></i></div></div>';
    }).join("") + "</div></div>" +
    (rep.rehearsed ? '<div class="note rose" style="margin-top:12px"><span class="ic">⚠</span><div><b>Scripted delivery suspected.</b> Your answers contained no filled pauses, no self-corrections and unusually uniform lexical variety. Examiners treat this as evidence of a memorised answer and may discount the response — try answering new questions with only a 20-second plan.</div></div>' : "") +
    '<div class="note amber" style="margin-top:12px"><span class="ic">ⓘ</span><div>' + esc(rep.disclaimer) + "</div></div></div>" +

    '<div class="grid g2"><div class="card"><div class="card-h"><h3>Criterion justifications</h3></div>' + rep.criteria.map(function (c) {
      return '<div style="padding:10px 0;border-bottom:1px dashed var(--line-2)"><div class="row" style="justify-content:space-between"><b>' + esc(c.name) + '</b><span class="band-chip">' + c.band.toFixed(1) + '</span></div><div class="small" style="margin-top:6px">' + esc(c.why) + "</div></div>";
    }).join("") + "</div>" +
    '<div class="card"><div class="card-h"><h3>Fluency analytics</h3></div>' +
    '<div class="grid g2" style="gap:9px">' +
    [["Speech rate", rep.wpm ? rep.wpm + " wpm" : "—", rep.wpm ? (rep.wpm < 100 ? "slow — aim 110–170" : rep.wpm > 185 ? "rushed — slow down slightly" : "in the natural range") : "no timing captured"],
    ["Filled pauses", rep.fillerTotal + " (" + pct(rep.fillerRate) + "%)", rep.fillerRate > 0.06 ? "high — replace with linking phrases" : "controlled"],
    ["Self-corrections", String(rep.repairs), rep.repairs > 4 ? "frequent rephrasing — plan the sentence first" : "natural repair rate"],
    ["Mean length of run", rep.mlr + " words", rep.mlr < 8 ? "short — extend answers with reasons" : "good continuous speech"]].map(function (r) {
      return '<div class="stat" style="padding:10px"><div class="k">' + r[0] + '</div><div class="v" style="font-size:19px">' + esc(r[1]) + '</div><div class="small muted">' + esc(r[2]) + "</div></div>";
    }).join("") + "</div>" +
    (rep.fillerHits.length ? '<div class="hr"></div><div class="upper">Filler words detected</div>' + rep.fillerHits.map(function (f) { return barRow('"' + f.filler + '"', f.n, rep.fillerHits[0].n, "amber"); }).join("") : "") +
    (rep.repetitions.length ? '<div class="hr"></div><div class="upper">Repetition analysis</div>' + rep.repetitions.slice(0, 6).map(function (r) { return '<span class="chip rose">' + esc(r.word) + " ×" + r.n + "</span> "; }).join("") + '<div class="small muted" style="margin-top:6px">Each repeated content word is a missed opportunity to show range. Substitute at least half of them.</div>' : "") +
    '<div class="hr"></div><div class="upper">Sentence complexity & grammar range</div>' +
    '<div class="small">Subordinating structures used: ' + (rep.subordinators.join(", ") || "few detected") + "</div>" +
    '<div class="small">Discourse markers used: ' + (rep.linkers.join(", ") || "few detected") + "</div>" +
    (rep.errors.length ? '<div class="small" style="margin-top:8px"><b>Flagged grammar issues:</b> ' + rep.errors.slice(0, 5).map(function (e) { return esc(e.match) + " → " + esc(e.suggestion || e.message); }).join("; ") + "</div>" : "") +
    "</div></div>" +

    '<div class="card"><div class="card-h"><h2>Suggested improvements, with reasons</h2></div>' +
    rep.improvements.map(function (i) {
      return '<div style="padding:11px 0;border-bottom:1px dashed var(--line-2)"><span class="chip violet">' + esc(i.type) + '</span>' +
        '<div class="quote" style="margin-top:8px;border-left-color:var(--rose);background:#fdf5f7">' + esc(i.before) + "</div>" +
        '<div class="quote" style="margin-top:8px">' + esc(i.after) + "</div>" +
        '<div class="small muted" style="margin-top:6px"><b>Why:</b> ' + esc(i.why) + "</div></div>";
    }).join("") +
    (rep.improvements.length ? "" : '<div class="note green"><span class="ic">✓</span><div>No systematic weaknesses detected in this answer set. Next step: increase question difficulty — try the environment or city sets, which demand more abstract Part 3 language.</div></div>') +
    '<div class="row" style="margin-top:14px"><button class="btn primary" data-act="retry-speaking">Answer again (different set)</button><button class="btn" data-act="go" data-route="progress">Progress</button><button class="btn" data-act="go" data-route="grammar">Grammar builder</button></div></div>';
}

/* ------------------------------ vocabulary ------------------------------- */
Views.vocabulary = function () {
  var words = Vocab.all(), v = Store.get().vocab, due = Vocab.due();
  var f = App.vparams || (App.vparams = { q: "", topic: "", saved: false });
  var filtered = words.filter(function (w) {
    if (f.q && (w.word + w.meaning).toLowerCase().indexOf(f.q.toLowerCase()) === -1) return false;
    if (f.topic && w.topic !== f.topic) return false;
    if (f.saved && !Vocab.isSaved(w.word)) return false;
    return true;
  });
  var topics = Object.keys(groupBy(words, function (w) { return w.topic; }));
  return '<div class="grid g4" style="margin-bottom:16px">' +
    '<div class="card tight"><div class="stat"><div class="k">Words in bank</div><div class="v">' + words.length + '</div><div class="d">' + topics.length + " topic areas</div></div></div>" +
    '<div class="card tight"><div class="stat"><div class="k">Saved</div><div class="v">' + (v.saved || []).length + '</div><div class="d">your personal list</div></div></div>' +
    '<div class="card tight"><div class="stat ' + (due.length ? "warn" : "") + '"><div class="k">Due for review</div><div class="v">' + due.length + '</div><div class="d">spaced repetition</div></div></div>' +
    '<div class="card tight"><div class="stat"><div class="k">Learned</div><div class="v">' + (v.learned || []).length + '</div><div class="d">reviewed at least once</div></div></div></div>' +

    '<div class="card"><div class="card-h"><h2>Spaced repetition session</h2><div class="spacer"></div><button class="btn primary" data-act="srs-start">Start ' + Math.min(12, Math.max(1, due.length || 10)) + "-word session</button></div>" +
    '<p class="small muted">Words you save enter a review queue scheduled by an SM-2 style algorithm: each word is shown, you rate how well you knew it, and the next review is scheduled further ahead the stronger your recall. Due today: ' + due.length + ".</p>" +
    (App.srs && App.srs.active ? srsHTML() : "") + "</div>" +

    '<div class="card"><div class="card-h"><h2>Word list</h2><div class="spacer"></div>' +
    '<input type="text" style="max-width:220px" placeholder="Search word or meaning" data-input="vocab-q" value="' + esc(f.q) + '">' +
    '<select style="max-width:170px" data-input="vocab-topic"><option value="">All topics</option>' + topics.map(function (t) { return '<option value="' + esc(t) + '"' + (f.topic === t ? " selected" : "") + ">" + esc(t) + "</option>"; }).join("") + "</select>" +
    '<label class="row small" style="gap:6px;margin:0"><input type="checkbox" data-input="vocab-saved"' + (f.saved ? " checked" : "") + "> saved only</label>" +
    '<span class="chip grey">' + filtered.length + " shown</span></div>" +
    '<table class="tbl"><thead><tr><th>Word</th><th>Meaning</th><th>Topic</th><th>Band</th><th></th></tr></thead><tbody>' +
    filtered.slice(0, 120).map(function (w) {
      return '<tr><td><b>' + esc(w.word) + '</b><div class="small muted">' + esc(w.pos) + " · " + esc(w.ipa) + "</div></td><td class=\"small\">" + esc(w.meaning) + "</td><td><span class=\"chip grey\">" + esc(w.topic) + '</span></td><td><span class="chip">' + esc(w.band) + '</span></td><td><div class="row tight"><button class="btn sm" data-act="vocab-open" data-word="' + esc(w.word) + '">Open</button>' +
        '<button class="btn sm ' + (Vocab.isSaved(w.word) ? "teal" : "") + '" data-act="vocab-save" data-word="' + esc(w.word) + '">' + (Vocab.isSaved(w.word) ? "Saved" : "Save") + "</button></div></td></tr>";
    }).join("") + "</tbody></table></div>";
};

function srsHTML() {
  var q = App.srs.queue, i = App.srs.i;
  if (i >= q.length) return '<div class="note green" style="margin-top:12px"><span class="ic">✓</span><div>Session complete — ' + q.length + " words reviewed. Next reviews are scheduled in your queue.</div><button class=\"btn sm\" style=\"margin-top:8px\" data-act=\"srs-end\">Close</button></div>";
  var w = q[i];
  if (!w) return '<div class="small muted">No words queued. Save words from the list below to build a queue.</div>';
  return '<div class="flashcard" style="margin-top:14px"><div class="face">' +
    '<div class="row" style="justify-content:space-between"><span class="chip grey">' + (i + 1) + " / " + q.length + '</span><span class="chip">' + esc(w.band) + "</span></div>" +
    '<h2 style="margin-top:10px">' + esc(w.word) + '</h2><div class="small muted">' + esc(w.pos) + " · " + esc(w.ipa) + "</div>" +
    (App.srs.reveal ? '<div class="hr"></div><div><b>Meaning:</b> ' + esc(w.meaning) + "</div>" +
      "<div style=\"margin-top:6px\"><b>Synonyms:</b> " + esc(w.synonyms.join(", ")) + "</div>" +
      "<div><b>Antonyms:</b> " + esc(w.antonyms.join(", ")) + "</div>" +
      "<div style=\"margin-top:6px\"><b>Collocations:</b> " + esc(w.collocations.join(" · ")) + "</div>" +
      '<div class="quote" style="margin-top:8px">' + esc(w.ieltsExample) + "</div>" +
      '<div class="row" style="margin-top:12px"><button class="btn rose" data-act="srs-grade" data-g="1">Again</button>' +
      '<button class="btn" data-act="srs-grade" data-g="2">Hard</button>' +
      '<button class="btn teal" data-act="srs-grade" data-g="3">Good</button>' +
      '<button class="btn primary" data-act="srs-grade" data-g="4">Easy</button></div>'
      : '<button class="btn primary" style="margin-top:18px" data-act="srs-reveal">Reveal meaning</button>') +
    "</div></div>";
}

Views.vocabulary_word = function () { return Views.vocabulary(); };

/* -------------------------------- grammar -------------------------------- */
Views.grammar = function () {
  var cats = window.BANK_GRAMMAR.categories, errs = Analytics.grammarErrors();
  var g = App.grammar || (App.grammar = { cat: null, answers: {}, checked: false });
  var cat = cats.filter(function (c) { return c.id === g.cat; })[0];
  return '<div class="grid g3" style="margin-bottom:16px">' +
    '<div class="card tight"><div class="stat"><div class="k">Error categories tracked</div><div class="v">' + cats.length + '</div><div class="d">' + cats.reduce(function (a, c) { return a + c.items.length; }, 0) + " exercise items</div></div></div>" +
    '<div class="card tight"><div class="stat ' + (errs.length ? "warn" : "") + '"><div class="k">Your logged errors</div><div class="v">' + Store.get().errorTags.length + '</div><div class="d">from Writing and Grammar tasks</div></div></div>' +
    '<div class="card tight"><div class="stat"><div class="k">Top pattern</div><div class="v" style="font-size:17px">' + (errs[0] ? esc(errs[0].category) : "—") + '</div><div class="d">' + (errs[0] ? errs[0].count + " occurrences" : "write an essay to populate") + "</div></div></div></div>" +

    '<div class="card"><div class="card-h"><h2>Exercises generated from your mistakes</h2><div class="spacer"></div>' +
    '<button class="btn primary" data-act="grammar-generate">' + (errs.length ? "Build a set from my " + errs.length + " error categories" : "Build a mixed set") + "</button></div>" +
    '<p class="small muted">Every grammar error logged from your writing is stored by category. The generator assembles a set weighted towards your most frequent categories, so you practise the rule you actually break.</p>' +
    (App.grammarGenerated ? grammarSetHTML(App.grammarGenerated) : "") + "</div>" +

    '<div class="grid g2"><div class="card"><div class="card-h"><h3>Categories</h3></div>' +
    cats.map(function (c) {
      var n = errs.filter(function (e) { return e.category === c.category; })[0];
      return '<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line-2)"><div><b class="small">' + esc(c.category) + "</b>" + (n ? ' <span class="chip rose">' + n.count + " errors</span>" : "") + '</div><button class="btn sm" data-act="grammar-open" data-id="' + c.id + '">' + (g.cat === c.id ? "Open" : "Study") + "</button></div>";
    }).join("") + "</div>" +
    (cat ? '<div class="card"><div class="card-h"><h3>' + esc(cat.category) + '</h3><div class="spacer"></div><button class="btn sm" data-act="grammar-open" data-id="">Close</button></div>' +
      '<div class="note"><span class="ic">❖</span><div><b>Rule:</b> ' + esc(cat.rule) + "</div></div>" +
      cat.items.map(function (it, i) {
        var key = cat.id + "-" + i;
        var sel = g.answers[key];
        return '<div class="qcard" style="margin-top:12px"><div class="qprompt">' + esc(it.q) + "</div>" +
          it.options.map(function (o) {
            var cls = "";
            if (g.checked) { if (o === it.answer) cls = "ok"; else if (o === sel) cls = "no"; }
            else if (o === sel) cls = "sel";
            return '<label class="opt ' + cls + '"><input type="radio" name="' + key + '" data-input="grammar" data-key="' + key + '" value="' + esc(o) + '"' + (sel === o ? " checked" : "") + "><span>" + esc(o) + "</span></label>";
          }).join("") +
          (g.checked ? '<div class="explain"><div class="ex-row"><div class="ex-k">Why</div><div class="ex-v">' + esc(it.why) + "</div></div></div>" : "") + "</div>";
      }).join("") +
      '<div class="row" style="margin-top:12px"><button class="btn primary" data-act="grammar-check">Check answers</button></div></div>' : "") +
    "</div>";
};

function grammarSetHTML(set) {
  var g = App.grammarGenState || (App.grammarGenState = { answers: {}, checked: false });
  return '<div class="grid g2" style="margin-top:12px">' + set.map(function (it, i) {
    var key = "gen-" + i, sel = g.answers[key];
    return '<div class="qcard"><div class="qhead"><span class="qnum">' + (i + 1) + '</span><span class="chip violet">' + esc(it.category) + "</span></div>" +
      '<div class="qprompt">' + esc(it.q) + "</div>" + it.options.map(function (o) {
        var cls = g.checked ? (o === it.answer ? "ok" : o === sel ? "no" : "") : (o === sel ? "sel" : "");
        return '<label class="opt ' + cls + '"><input type="radio" name="' + key + '" data-input="gen" data-key="' + key + '" value="' + esc(o) + '"' + (sel === o ? " checked" : "") + "><span>" + esc(o) + "</span></label>";
      }).join("") + (g.checked ? '<div class="small muted" style="margin-top:8px">' + esc(it.why) + "</div>" : "") + "</div>";
  }).join("") + "</div>" +
    '<div class="row" style="margin-top:12px"><button class="btn primary" data-act="grammar-check-gen">Check answers</button>' +
    (g.checked ? '<button class="btn" data-act="grammar-log">Log wrong answers to my error profile</button>' : "") + "</div>";
}

/* ------------------------------- progress -------------------------------- */
Views.progress = function () {
  var b = Analytics.bands(), p = Store.get().profile;
  var byType = Analytics.typeAccuracy(), byDiff = Analytics.difficultyAccuracy();
  var resp = Store.get().responses, acc = resp.length ? resp.filter(function (r) { return r.correct; }).length / resp.length : 0;
  var atts = Store.get().attempts;
  var errs = Analytics.grammarErrors(), vp = Analytics.vocabProgress();
  return '<div class="grid g4" style="margin-bottom:16px">' +
    '<div class="card tight"><div class="stat"><div class="k">Questions answered</div><div class="v">' + resp.length + '</div><div class="d">across ' + atts.length + " attempts</div></div></div>" +
    '<div class="card tight"><div class="stat ' + (acc >= 0.7 ? "good" : acc >= 0.5 ? "warn" : "bad") + '"><div class="k">Overall accuracy</div><div class="v">' + pct(acc) + '%</div><div class="d">' + resp.filter(function (r) { return r.correct; }).length + " correct</div></div></div>" +
    '<div class="card tight"><div class="stat"><div class="k">Avg. session length</div><div class="v">' + Math.round(Analytics.timing().avgSeconds / 60) + 'm</div><div class="d">planned time vs actual is compared on each result page</div></div></div>' +
    '<div class="card tight"><div class="stat"><div class="k">Vocabulary</div><div class="v">' + vp.saved + '</div><div class="d">' + vp.learned + " reviewed · " + vp.due + " due</div></div></div></div>" +

    '<div class="grid g2"><div class="card"><div class="card-h"><h3>Band progression</h3><div class="spacer"></div><span class="chip grey">estimate, recency-weighted</span></div>' +
    SKILLS.map(function (s) {
      var t = Analytics.trend(s);
      return '<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b class="small">' + s.charAt(0).toUpperCase() + s.slice(1) + '</b><span class="small muted">' + (b[s] == null ? "—" : "now " + b[s].toFixed(1)) + " · target " + p.targetBand.toFixed(1) + "</span></div>" + sparkline(t, { min: 4, max: 9 }) + "</div>";
    }).join("") + "</div>" +

    '<div class="card"><div class="card-h"><h3>Accuracy by question type</h3></div>' +
    (byType.length ? byType.map(function (t) {

    }).join("") : '<div class="small muted">Complete some objective practice to populate this matrix.</div>') + "</div></div>" +

    '<div class="grid g3"><div class="card"><div class="card-h"><h3>Accuracy by difficulty</h3></div>' +
    (byDiff.length ? byDiff.map(function (d) { return barRow(d.difficulty + " (" + d.total + ")", pct(d.accuracy) + "%", 100, d.accuracy < 0.6 ? "rose" : "teal"); }).join("") : '<div class="small muted">No data yet.</div>') +
    '<div class="small muted" style="margin-top:8px">If accuracy drops sharply at Band 7+ but is high at beginner level, your ceiling is reasoning load rather than vocabulary. Move to untimed mode on advanced sets and study the explanations.</div></div>' +
    '<div class="card"><div class="card-h"><h3>Strong / weak types</h3></div>' +
    '<div class="upper">Weakest</div>' + (Analytics.weakTypes(2).slice(0, 5).map(function (t) { return '<div class="row" style="justify-content:space-between"><span class="small">' + esc(t.label) + '</span><span class="chip rose">' + pct(t.accuracy) + "%</span></div>"; }).join("") || '<div class="small muted">none logged</div>') +
    '<div class="upper" style="margin-top:10px">Strongest</div>' + (Analytics.strongTypes(2).slice(0, 5).map(function (t) { return '<div class="row" style="justify-content:space-between"><span class="small">' + esc(t.label) + '</span><span class="chip green">' + pct(t.accuracy) + "%</span></div>"; }).join("") || '<div class="small muted">none logged</div>') +
    '<div class="hr"></div><button class="btn primary block" data-act="start-weakness">Drill my weakest types</button></div>' +
    '<div class="card"><div class="card-h"><h3>Grammar error profile</h3></div>' +
    (errs.length ? errs.slice(0, 8).map(function (e) { return barRow(e.category, e.count, errs[0].count, "amber"); }).join("") : '<div class="small muted">No grammar errors logged yet. Evaluate a writing task to build this profile.</div>') +
    '<div class="row" style="margin-top:10px"><button class="btn sm" data-act="go" data-route="grammar">Open Grammar builder</button></div></div></div>' +

    '<div class="card"><div class="card-h"><h3>Complete attempt log</h3><div class="spacer"></div>' +

    (atts.length ? '<table class="tbl"><thead><tr><th>Date</th><th>Mode</th><th>Skill</th><th>Raw</th><th>Band</th><th>Accuracy</th><th>Time</th><th>Timed</th><th></th></tr></thead><tbody>' +
      atts.slice().reverse().slice(0, 40).map(function (a) {

      }).join("") + "</tbody></table>" : '<div class="empty">No attempts recorded yet.</div>') + "</div>";

/* ------------------------------- study plan ------------------------------ */
Views.plan = function () {
  var p = Store.get().profile, plan = Store.get().plan;
  var days = plan && plan.days ? plan.days : [];
  var done = (plan && plan.done) || {};
  var today = new Date().toISOString().slice(0, 10);
  return '<div class="card"><div class="card-h"><h2>Your goal settings</h2></div>' +
    '<div class="grid g4">' +
    '<div class="field"><label>Module</label><select data-input="profile" data-k="module"><option value="academic"' + (p.module === "academic" ? " selected" : "") + ">Academic</option><option value=\"general\"" + (p.module === "general" ? " selected" : "") + ">General Training</option></select></div>" +
    '<div class="field"><label>Target band</label><select data-input="profile" data-k="targetBand">' + [6, 6.5, 7, 7.5, 8, 8.5, 9].map(function (x) { return '<option value="' + x + '"' + (x === p.targetBand ? " selected" : "") + ">Band " + x.toFixed(1) + "</option>"; }).join("") + "</select></div>" +
    '<div class="field"><label>Exam date</label><input type="date" data-input="profile" data-k="examDate" value="' + p.examDate + '"></div>' +
    '<div class="field"><label>Daily study time</label><select data-input="profile" data-k="dailyMinutes">' + [30, 45, 60, 90, 120].map(function (x) { return '<option value="' + x + '"' + (x === p.dailyMinutes ? " selected" : "") + ">" + x + " min</option>"; }).join("") + "</select></div>" +
    "</div>" +
    '<div class="row"><button class="btn primary" data-act="generate-plan">' + (days.length ? "Regenerate plan" : "Generate my plan") + "</button>" +
    '<span class="small muted">' + (days.length ? days.length + " days scheduled · generated " + fmtDateTime(plan.generatedAt) : "The plan re-weights automatically from your latest results.") + "</span></div></div>" +

    (days.length ? (function () {

/* ------------------------------- timers --------------------------------- */
function stopAppTimer() { if (App.timer.id) { clearInterval(App.timer.id); App.timer.id = null; } }
function startAppTimer() {
  stopAppTimer();
  App.timer.start = Date.now();
  App.timer.id = setInterval(function () {
    if (App.timer.paused) { App.timer.start = Date.now() - App.timer.elapsed * 1000; return; }
    App.timer.elapsed = Math.round((Date.now() - App.timer.start) / 1000);
    var el = $(".timerbar .timer");
    if (el) {
      var display = App.timer.duration ? Math.max(0, App.timer.duration - App.timer.elapsed) : App.timer.elapsed;
      el.textContent = fmtTime(display) + (App.timer.duration ? "" : " elapsed");
      el.classList.toggle("low", !!App.timer.duration && (App.timer.duration - App.timer.elapsed) < 120);
    }
    if (App.timer.duration && App.timer.elapsed >= App.timer.duration && !App.timer.paused) {
      stopAppTimer();
      toast("Time is up — your test has been submitted.");
      App.submitTest();
    }
  }, 1000);
}
function updateProgressUI() {
  var bar = $(".timerbar .bar > i");
  if (!bar || !App.test) return;
  var answered = App.test.items.filter(function (i) { return String(App.answers[i.id] || "").trim(); }).length;
  bar.style.width = (answered / App.test.items.length) * 100 + "%";
  var lbl = $(".timerbar .row .small");
  if (lbl) lbl.textContent = "Answered " + answered + "/" + App.test.items.length;
}

/* ------------------------------- actions (logic) ------------------------- */

    App.go("writingrun");

/* --------------------------- test launch & submit ------------------------ */
function prep(o) {
  o.items = o.items || [];
  o.id = o.id || uid("test");
  o.durationSec = o.durationSec != null ? o.durationSec : (o.timed === false ? 0 : o.items.length * 55);
  return o;
}
App.launchTest = function (t) {
  if (!t) return;
  if ((t.full || t.mockSection) && (!t.items || !t.items.length)) {
    var module = t.module || Store.get().profile.module;
    var assembly = t.skill === "listening"
      ? Bank.assemble({ mode: "skill", skill: "listening", count: 40, timed: t.timed, title: t.title })
      : Bank.assemble({ mode: "full", module: module, title: t.title });
    var items = t.skill === "listening" ? assembly.items.filter(function (i) { return i.skill === "listening"; }) : assembly.items;
    if (t.full && t.skill !== "listening" && t.skill !== "reading") { t = assembly; }
    else {
      t.items = items;
      var seen = {};
      t.contexts = [];
      items.forEach(function (i) { if (!seen[i.ctxId]) { seen[i.ctxId] = 1; t.contexts.push(i.ctx); } });
    }
  }
  if (t.full && !t.items.length) { toast("The bank does not have enough items for a full test — loading available items."); t.items = Bank.filter({}); }
  App.test = t;
  if (t.setKey) App.lastSetKey = t.setKey;
  App.answers = {}; App.flags = {}; App.qIndex = 0; App.review = false; App.pane = window.innerWidth <= 900 ? "questions" : "passage"; App.showTranscript = t.timed === false;
  App.result = null; App.timer = { id: null, start: 0, elapsed: 0, duration: t.timed ? (t.durationSec || t.items.length * 60) : 0, paused: false };
  App.go("runner");
  startAppTimer();
};
App.replaceRunner = function () {
  var tb = $(".timerbar"), wrap = $(".runner");
  $("#view").innerHTML = Views.runner();
  App.after();
};
App.submitTest = function () {
  var t = App.test;
  if (!t) return;
  /* stop any running audio */
  Listening.stop();
  stopAppTimer();
  var res = scoreTest(t, App.answers);
  if (t.skill === "mixed") {
    /* record separate reading / listening attempts plus the combined attempt */
    var rItems = res.detail.filter(function (d) { return d.item.skill === "reading"; });
    var lItems = res.detail.filter(function (d) { return d.item.skill === "listening"; });
    var groups = [["reading", rItems], ["listening", lItems]];
    groups.forEach(function (g) {
      if (!g[1].length) return;
      var sub = { raw: g[1].filter(function (d) { return d.correct; }).length, outOf: g[1].length, accuracy: g[1].filter(function (d) { return d.correct; }).length / g[1].length, band: rawToBand(g[1].filter(function (d) { return d.correct; }).length, g[1].length, g[0], t.module), breakdown: res.breakdown, detail: g[1] };
      recordAttempt({ id: t.id + "-" + g[0], mode: t.mode, skill: g[0], module: t.module, title: t.title, timed: t.timed, bandTarget: t.bandTarget, durationSec: t.durationSec }, sub);
    });
  } else {
    recordAttempt(t, res);
  }
  App.result = res;
  App.submitted = true;
  App.route = "result";
  App.render();
};

/* ------------------------------- input events ---------------------------- */
function bindInputs(root) {
  $$("[data-answer]", root).forEach(function (el) {
    el.addEventListener("input", function () {
      App.answers[el.dataset.answer] = el.value;
      updateProgressUI();
    });
    el.addEventListener("change", function () {
      App.answers[el.dataset.answer] = el.value;
      updateProgressUI();
      if (el.type === "radio") {
        var card = el.closest(".qcard");
        if (card) $$("label.opt", card).forEach(function (l) { l.classList.remove("sel"); });
        var lab = el.closest("label.opt"); if (lab) lab.classList.add("sel");
      }
    });
  });
  $$("[data-input]", root).forEach(function (el) {
    var kind = el.dataset.input;
    var handler = function () {
      if (kind === "writing") {
        App.writing.text = el.value;
        var c = $(".timerbar .timer[style]");
        var wc = $$(".timerbar .timer")[1];
        if (wc) wc.textContent = countWords(el.value) + " words / " + App.writing.task.minWords + " min";
      } else if (kind === "sp-answer") {
        App.speaking.answers[parseInt(el.dataset.i, 10)] = el.value;
      } else if (kind === "sp-answer3") {
        App.speaking.answers3[parseInt(el.dataset.i, 10)] = el.value;
      } else if (kind === "sp-part2") {
        App.speaking.part2Text = el.value;
        var st = $$("#part2-state")[0];
        if (st) st.textContent = countWords(el.value) + " words transcribed";
      } else if (kind === "grammar") {
        App.grammar.answers[el.dataset.key] = el.value;
      } else if (kind === "gen") {
        App.grammarGenState.answers[el.dataset.key] = el.value;
      } else if (kind === "profile") {
        var k = el.dataset.k, v = el.value;
        Store.get().profile[k] = (k === "targetBand" || k === "currentBand") ? parseFloat(v) : (k === "dailyMinutes" ? parseInt(v, 10) : v);
        Store.save();
      } else if (kind === "plan-task") {
        var pl = Store.get().plan; pl.done = pl.done || {};
        if (el.checked) pl.done[el.dataset.key] = 1; else delete pl.done[el.dataset.key];
        Store.save();
      } else if (kind === "vocab-q") {
        App.vparams.q = el.value; Views._debouncedVocab();
      } else if (kind === "vocab-topic") {
        App.vparams.topic = el.value; App.refresh();
      } else if (kind === "vocab-saved") {
        App.vparams.saved = el.checked; App.refresh();
      } else if (kind === "tutor") {
        /* value read on send */
      }
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });
}
var _vocabTimer = null;
Views._debouncedVocab = function () {
  clearTimeout(_vocabTimer);
  _vocabTimer = setTimeout(function () {
    var focused = document.activeElement, key = focused && focused.dataset && focused.dataset.input;
    App.refresh();
    if (key === "vocab-q") {
      var el = $("[data-input=vocab-q]");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }
  }, 260);
};

/* ------------------------------- keyboard ------------------------------- */
function bindKeys() {
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "TEXTAREA" || (e.target.tagName === "INPUT" && e.target.type === "text")) {
      if (e.key === "Enter" && e.ctrlKey) { if (App.route === "runner") App.submitTest(); if (App.route === "writingrun") ACTIONS["evaluate-writing"](); }
      return;
    }
    if (App.route === "runner" && App.test) {
      if (e.key === "ArrowRight") { e.preventDefault(); ACTIONS["next-q"](); }
      if (e.key === "ArrowLeft") { e.preventDefault(); ACTIONS["prev-q"](); }
      if (e.key === "f" || e.key === "F") { var it = App.test.items[App.qIndex]; if (it) { App.flags[it.id] ? delete App.flags[it.id] : App.flags[it.id] = 1; App.replaceRunner(); } }
      if (e.key === "Enter" && e.ctrlKey) App.submitTest();
    }
    if (e.key === "Escape") closeModal();
  });
}

/* --------------------------------- boot ---------------------------------- */
function boot() {
  Bank.build();
  /* seed a couple of saved words so the review queue is demonstrable */
  if (!Store.get().vocab.saved.length) {
    Store.get().vocab.saved = ["mitigate", "ubiquitous", "disparity"];
    Store.save();
  }
  renderShell();
  bindInputs(document);
  bindKeys();
  /* delegated click handling */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.dataset.act;
    if (act === "go" && el.tagName === "A") e.preventDefault();
    if (ACTIONS[act]) { ACTIONS[act](el); }
  });
  /* re-bind inputs after every render */
  var mo = new MutationObserver(function () {
    bindInputs(document);
  });
  mo.observe($("#view"), { childList: true, subtree: true });
  /* tap the dimmed backdrop to close the mobile menu */
  var bd = $("#backdrop");
  if (bd) bd.addEventListener("click", function () { ACTIONS["close-menu"](); });
  /* import handler */
  document.addEventListener("change", function (e) {
    if (e.target.id !== "import-file" || !e.target.files || !e.target.files[0]) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var data = JSON.parse(fr.result);
        Store.s = data; Store.save(); toast("Data imported."); refreshShell();
      } catch (err) { toast("That file could not be read as JSON."); }
    };
    fr.readAsText(e.target.files[0]);
  });
  /* hash routing */
  window.addEventListener("hashchange", function () {
    var r = window.location.hash.replace("#", "");
    if (r && Views[r] && r !== App.route) App.go(r);
  });
  var start = window.location.hash.replace("#", "");
  App.route = Views[start] ? start : "dashboard";
  App.render();
  /* automatic study plan on first run */
  if (!Store.get().plan.generatedAt && Store.get().profile.onboarded) {
    StudyPlan.save(StudyPlan.generate());
  }
  var rep = Validator.run();
  if (rep.errors.length) console.warn("Bank validator:", rep.errors.length, "errors,", rep.warnings.length, "warnings");
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

</script>
