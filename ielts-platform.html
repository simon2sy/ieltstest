<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Mastery — Practice, Scoring &amp; Analytics Platform</title>
<meta name="description" content="A complete IELTS preparation platform: Reading, Listening, Writing and Speaking practice with scoring, explanations, weakness detection and a personalized study plan. Writing and Speaking scores are AI estimates.">
<style>
/* =========================================================================
   IELTS MASTERY — design system
   Tokens → layout shell → components → test runner → responsive rules
   ========================================================================= */
:root{
  --navy:#0f1c33; --navy-2:#16274a; --navy-3:#1e3459;
  --ink:#12213b; --body:#33415c; --muted:#6b7a99; --faint:#93a0b8;
  --line:#e2e7f1; --line-2:#eef1f8;
  --bg:#f4f6fb; --card:#ffffff; --card-2:#fafbfe;
  --primary:#2f4be0; --primary-d:#2138bd; --primary-l:#eaeeff;
  --teal:#0f9b8e; --amber:#d98a00; --rose:#d7446b; --green:#12a150; --violet:#7b4bd8;
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --sh-1:0 1px 2px rgba(16,32,64,.06),0 1px 3px rgba(16,32,64,.05);
  --sh-2:0 4px 14px rgba(16,32,64,.08);
  --sh-3:0 12px 34px rgba(16,32,64,.14);
  --ff:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --ff-read:Georgia,"Times New Roman",serif;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  --sidebar:264px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{color:var(--ink);margin:0 0 .4em;line-height:1.22;font-weight:700;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
p{margin:0 0 .85em}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
small,.small{font-size:12.5px}
.mono{font-family:var(--mono);font-size:12.5px}
::selection{background:#c9d4ff}

/* ---------------- layout shell ---------------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--navy);color:#cfd8ea;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px 26px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;color:#fff}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--teal));display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;letter-spacing:.5px}
.brand b{font-size:15px;display:block;line-height:1.15}
.brand span{font-size:11px;color:#8fa0c4;letter-spacing:.08em;text-transform:uppercase}
.nav-group{margin:14px 0 4px;padding:0 10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7c8db3}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#c3cee6;font-size:14px;font-weight:500;text-decoration:none;margin-bottom:2px;transition:background .15s,color .15s}
.nav a:hover{background:var(--navy-2);color:#fff;text-decoration:none}
.nav a.active{background:linear-gradient(90deg,var(--primary),#3a56ea);color:#fff;box-shadow:var(--sh-2)}
.nav a .ic{width:18px;text-align:center;opacity:.9}
.side-card{margin:16px 8px 0;padding:12px;border-radius:var(--r);background:var(--navy-2);border:1px solid #263c66}
.side-card h5{color:#fff;font-size:12px;margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase}
.side-card .row{display:flex;justify-content:space-between;font-size:12.5px;color:#a9b8d6;padding:2px 0}
.side-card .row b{color:#fff}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:18px;margin:0}
.topbar .sub{font-size:12.5px;color:var(--muted)}
.spacer{flex:1}
.content{padding:22px;max-width:1400px;width:100%;margin:0 auto}
.menu-btn{display:none;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:8px 11px;font-size:16px;cursor:pointer}

/* ---------------- primitives ---------------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px;margin-bottom:16px}
.card.tight{padding:14px}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0}
.card-h .spacer{flex:1}
.grid{display:grid;gap:16px}
.grid>*{min-width:0} /* stop unbreakable content from blowing out grid tracks */
.card{min-width:0}
.word-break,.small,.d{overflow-wrap:break-word}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.col{display:flex;flex-direction:column;gap:10px}
.stack>*+*{margin-top:10px}
.center{text-align:center}
.right{text-align:right}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.b{font-weight:700}
.upper{text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--muted);font-weight:700}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.divider{border-top:1px dashed var(--line);margin:12px 0}

.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;box-shadow:var(--sh-1)}
.btn:hover{border-color:#c9d3e8;transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--primary),#3a56ea);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.teal{background:linear-gradient(135deg,var(--teal),#12b3a3);border-color:transparent;color:#fff}
.btn.dark{background:var(--navy);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn.rose{background:var(--rose);border-color:transparent;color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:12px 20px;font-size:15px}
.btn.block{width:100%;justify-content:center}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--primary-l);color:var(--primary-d);border:1px solid #d5deff}
.chip.teal{background:#e5f7f5;color:#0a7a70;border-color:#c8ece8}
.chip.amber{background:#fdf3e2;color:#9c6400;border-color:#f6e2c0}
.chip.rose{background:#fdeaef;color:#b02950;border-color:#f8d3de}
.chip.green{background:#e6f7ee;color:#0a7a3d;border-color:#c9ecd9}
.chip.grey{background:#f0f3f9;color:#5c6b8a;border-color:#e2e7f1}
.chip.violet{background:#f1ebfd;color:#5f34b8;border-color:#e2d6fb}

.badge{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:12.5px}
.band-chip{font-weight:800;font-size:15px;padding:4px 12px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;letter-spacing:.02em}

.stat{padding:14px;border-radius:var(--r);background:var(--card-2);border:1px solid var(--line)}
.stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.stat .v{font-size:26px;font-weight:800;color:var(--ink);line-height:1.15;margin-top:4px}
.stat .d{font-size:12.5px;color:var(--muted)}
.stat.good .v{color:var(--green)} .stat.warn .v{color:var(--amber)} .stat.bad .v{color:var(--rose)}

.bar{height:9px;border-radius:6px;background:var(--line-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),#5b7bff)}
.bar.teal>i{background:linear-gradient(90deg,var(--teal),#22c3b1)}
.bar.rose>i{background:linear-gradient(90deg,var(--rose),#ef7a97)}
.bar.amber>i{background:linear-gradient(90deg,var(--amber),#f0b03f)}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tr:hover td{background:#fafbff}

.field{display:block;margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:5px}
.field .hint{font-size:12px;color:var(--muted);font-weight:400;margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #c9d4ff;border-color:var(--primary);outline-offset:0}
textarea{line-height:1.6;resize:vertical}
label.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:7px;transition:.12s;background:#fff}
label.opt:hover{border-color:#c9d3e8;background:#fbfcff}
label.opt input{margin-top:3px}
label.opt.sel{border-color:var(--primary);background:var(--primary-l)}
label.opt.ok{border-color:#9fdcbb;background:#f0fbf5}
label.opt.no{border-color:#f3b7c8;background:#fdf2f5}
label.tile{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:13px;transition:.15s;display:block}
label.tile:hover{border-color:var(--primary);box-shadow:var(--sh-2)}
label.tile input{display:none}
label.tile.sel{border-color:var(--primary);background:var(--primary-l);box-shadow:var(--sh-2)}

.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);background:#f3f6ff;border:1px solid #dde4ff;font-size:13.5px}
.note.teal{background:#eefaf8;border-color:#cbeee9}
.note.amber{background:#fdf7ea;border-color:#f6e6c4}
.note.rose{background:#fdf1f5;border-color:#f8d3de}
.note.green{background:#effaf3;border-color:#c9ecd9}
.note .ic{font-size:16px;line-height:1.3}
.note b{color:var(--ink)}

.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px;padding-bottom:0}
.tabs button{background:transparent;border:0;border-bottom:2.5px solid transparent;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.active{color:var(--primary-d);border-color:var(--primary)}
.tabs button:hover{color:var(--ink)}

.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:8px;opacity:.55}

/* ---------------- test runner ---------------- */
.runner{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.reader{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--sh-1);position:sticky;top:74px;max-height:calc(100vh - 96px);overflow-y:auto}
.reader h3{margin-bottom:2px}
.reader .meta{font-size:12px;color:var(--muted);margin-bottom:12px}
.passage{font-family:var(--ff-read);font-size:16.5px;line-height:1.78;color:#1d2a44}
.passage p{margin:0 0 14px}
.passage .plabel{font-family:var(--ff);font-weight:800;color:var(--primary-d);font-size:13px;margin-right:7px}
.passage .qmark{background:#fff3c4;border-bottom:2px solid #f0c419;padding:1px 2px;border-radius:3px}
.transcript-line{display:flex;gap:10px;padding:7px 9px;border-radius:9px;margin-bottom:5px;font-size:14.5px;line-height:1.6}
.transcript-line .who{flex:0 0 92px;font-weight:700;color:var(--navy);font-size:12.5px}
.transcript-line.hit{background:#fff8dc;border:1px solid #f2e0a8}
.transcript-line.dist{background:#fdf2f5;border:1px solid #f6d7e0}
.transcript-line .tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:1px 6px;border-radius:6px;margin-left:6px}
.transcript-line .tag.ans{background:#12a150;color:#fff}
.transcript-line .tag.dis{background:var(--rose);color:#fff}
.transcript-line .tag.par{background:var(--violet);color:#fff}

.qwrap{display:flex;flex-direction:column;gap:14px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-1)}
.qcard.flagged{border-color:#f0c419;box-shadow:0 0 0 3px #fdf5da}
.qcard.current{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
.qhead{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.qnum{display:grid;place-items:center;min-width:28px;height:28px;border-radius:9px;background:var(--navy);color:#fff;font-weight:800;font-size:13px}
.qprompt{font-size:15px;color:var(--ink);font-weight:500;margin-bottom:10px}
.qprompt .lim{display:block;font-size:12px;color:var(--rose);font-weight:700;margin-top:4px}
.answerline{display:flex;gap:8px;align-items:center}
.answerline input{max-width:280px}
.kbd{font-family:var(--mono);font-size:11px;background:#f0f3f9;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}

.timerbar{position:sticky;top:0;z-index:25;background:linear-gradient(180deg,#fff,#fbfcff);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:14px;box-shadow:var(--sh-1);flex-wrap:wrap}
.timer{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--ink)}
.timer.low{color:var(--rose)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.qgrid button{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:0}
.qgrid button.done{background:#e6f7ee;border-color:#bfe8d2;color:#0a7a3d}
.qgrid button.flag{background:#fdf5da;border-color:#f0c419;color:#8a6300}
.qgrid button.cur{outline:2.5px solid var(--primary);outline-offset:1px}
.qgrid button.right{background:#e6f7ee;border-color:#9fdcbb;color:#0a7a3d}
.qgrid button.wrong{background:#fdeaef;border-color:#f3b7c8;color:#b02950}

.explain{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.explain .ex-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line-2)}
.explain .ex-row:last-child{border-bottom:0}
.explain .ex-k{flex:0 0 132px;font-size:12px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.explain .ex-v{font-size:13.8px;color:var(--body)}
.quote{border-left:3px solid var(--teal);background:#f5fcfb;padding:8px 12px;border-radius:0 8px 8px 0;font-family:var(--ff-read);font-size:14.5px;color:#1d2a44}

.band-hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.band-hero .big{font-size:54px;font-weight:800;color:var(--ink);line-height:1}
.band-hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}

.flashcard{perspective:1200px;margin:0 auto;max-width:560px}
.flashcard .face{background:linear-gradient(160deg,#fff,#f7f9ff);border:1px solid var(--line);border-radius:var(--r-xl);padding:26px;box-shadow:var(--sh-2);min-height:230px}

.chat{display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow-y:auto;padding:4px}
.msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:var(--sh-1)}
.msg.ai b{color:var(--navy)}
.quick{display:flex;gap:7px;flex-wrap:wrap}
.quick button{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--body);font-weight:600}
.quick button:hover{border-color:var(--primary);color:var(--primary-d)}

.priority{display:flex;gap:14px;align-items:center;padding:13px 15px;border-radius:var(--r);border:1px solid var(--line);background:#fff;margin-bottom:10px}
.priority .rank{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;flex:0 0 34px}
.priority.p1 .rank{background:var(--rose)} .priority.p2 .rank{background:var(--amber)} .priority.p3 .rank{background:var(--primary)}

.dayplan{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px;background:#fff}
.dayplan .dh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card-2);border-bottom:1px solid var(--line)}
.dayplan .dh b{color:var(--ink)}
.dayplan .tasks{padding:8px 14px 12px}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:13.8px}
.task:last-child{border-bottom:0}
.task input{margin-top:4px}
.task .sk{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:6px;background:var(--primary-l);color:var(--primary-d);flex:0 0 auto;margin-top:2px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--sh-3);font-size:13.5px;z-index:200;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;max-width:340px}
.toast.show{opacity:1;transform:none}
.modal-bg{position:fixed;inset:0;background:rgba(12,22,44,.55);display:grid;place-items:center;z-index:180;padding:18px}
.modal{background:#fff;border-radius:var(--r-lg);max-width:680px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--sh-3)}
.acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;overflow:hidden;background:#fff}
.acc>button{width:100%;text-align:left;background:#fff;border:0;padding:12px 14px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.acc .body{padding:0 14px 14px;font-size:13.8px}
.spark{width:100%;height:90px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.hidden{display:none !important}
@media print{.sidebar,.topbar,.btn{display:none}}

/* ---------------- mobile bottom tabs & backdrop ---------------- */
.mtabs{display:none}
.backdrop{display:none}

/* runner pane switcher — visible only on narrow screens (see media queries) */
.pane-toggle{display:none}
.pane-toggle button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;box-shadow:var(--sh-1);-webkit-tap-highlight-color:transparent}
.pane-toggle button.primary{background:var(--primary-l);border-color:var(--primary);color:var(--primary-d)}

/* ---------------- responsive ---------------- */
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .runner{grid-template-columns:1fr}
  .reader{position:static;max-height:none}
}
@media (max-width:1024px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--sh-3);height:auto}
  .sidebar.open{transform:none}
  .menu-btn{display:inline-flex}
  .g3,.g2{grid-template-columns:1fr}
  .content{padding:16px}
  .backdrop{position:fixed;inset:0;background:rgba(12,22,44,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
  .backdrop.show{opacity:1;pointer-events:auto}
}
@media (max-width:640px){
  :root{--sidebar:284px}
  html{-webkit-text-size-adjust:100%}
  body{font-size:14.5px}
  h1{font-size:20px} h2{font-size:18px} .topbar h1{font-size:16.5px}
  .topbar{padding:10px 12px;gap:8px}
  .topbar .sub{display:none}
  .tb-chip{display:none}
  .content{padding:12px 12px 86px} /* bottom padding clears the fixed tab bar */
  .card{padding:14px;border-radius:var(--r);margin-bottom:12px}
  .grid{gap:10px}

  /* grids collapse to a single comfortable column */
  .g2,.g3{grid-template-columns:1fr}
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}

  /* touch-friendly controls */
  .btn{padding:11px 15px;font-size:14px;border-radius:11px}
  .btn.sm{padding:8px 12px;font-size:13px}
  .btn.lg{width:100%;justify-content:center}
  .row .btn{flex:1 1 auto;justify-content:center}
  .pill-row{gap:7px}
  .pill-row .btn{flex:0 1 auto;justify-content:center}
  .field input,.field select,.field textarea{font-size:16px} /* stops iOS zoom-on-focus */
  input[type=text],input[type=number],input[type=date],select,textarea{font-size:15.5px}
  .answerline input{max-width:none;flex:1}
  .answerline{flex-wrap:nowrap}

  /* bottom tab bar */
  .mtabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(16,32,64,.08);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mtabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:10px;font-size:10.5px;font-weight:700;color:var(--muted);text-decoration:none;-webkit-tap-highlight-color:transparent}
  .mtabs a .ic{font-size:17px;line-height:1.1}
  .mtabs a.active{color:var(--primary-d);background:var(--primary-l)}
  .mtabs a:active{transform:scale(.96)}

  /* toast clears the tab bar */
  .toast{bottom:74px;left:12px;right:12px;max-width:none;text-align:center}

  /* tables scroll sideways instead of breaking the layout */
  .card{overflow-x:visible}
  table.tbl{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;font-size:13px}
  table.tbl th,table.tbl td{padding:8px 9px}

  /* stat cards & hero numbers */
  .stat{padding:11px}
  .stat .v{font-size:22px}
  .band-hero{gap:12px}
  .band-hero .big{font-size:40px}

  /* test runner: single column, sticky pane toggle */
  .passage{font-size:16px}
  .qcard{padding:13px}
  .timer{font-size:15.5px}
  .timerbar{gap:8px;padding:9px 10px;border-radius:var(--r)}
  .tb-progress{flex:1 1 100%;order:9;min-width:0}
  .timerbar .btn{flex:1 1 auto;justify-content:center}
  .pane-toggle{position:sticky;top:64px;z-index:24;gap:6px;background:var(--bg);padding:8px 0;margin-bottom:10px}

  /* navigator grid: bigger cells, fewer per row */
  .qgrid{grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px}
  .qgrid button{aspect-ratio:1;font-size:13.5px}
  .kbd-hint{display:none}

  /* chat & messages */
  .msg{max-width:94%}
  .modal{padding:16px;max-height:92vh}
  .modal-bg{padding:10px}

  /* writing editor */
  textarea{min-height:180px}
  .transcript-line{font-size:14px}
  .transcript-line .who{flex-basis:76px}

  /* practice-set cards: keep the grid but relax the internals */
  .card.tight{padding:12px}
  .flashcard .face{padding:18px;min-height:200px}
  .chat{max-height:48vh}
}

/* phones in landscape / very short screens: hide the tab bar to free space */
@media (max-width:640px) and (max-height:420px){
  .mtabs{display:none}
  .content{padding-bottom:12px}
}

/* ---------------- narrow-runner pane switching (phones & small tablets) --- */
@media (max-width:900px){
  .pane-toggle{display:flex}
  .runner{grid-template-columns:1fr}
  .reader{position:static;max-height:none;max-width:none}
  .runner.pane-passage .qwrap,.runner.pane-passage .card.tight{display:none}
  .runner.pane-questions .reader{display:none}
}

    text: [
      { label: "A", p: "On a still summer night, the air above a large city can be five to seven degrees warmer than the farmland twenty kilometres away. The effect, first documented in London in the early nineteenth century by a chemist who simply walked the streets with a thermometer, is now familiar as the urban heat island. Its causes are physical rather than meteorological. Asphalt, brick and dark roofing absorb far more solar radiation than soil or grass, and they release that energy slowly, long after sunset. Vegetation, which in rural areas converts incoming energy into water vapour, is in short supply. Meanwhile vehicles, factories and air-conditioning units pump waste heat directly into the streets, and tall buildings arranged along narrow streets trap infrared radiation in what researchers call the urban canyon effect." },
      { label: "B", p: "The consequences reach well beyond discomfort. Heat islands are most dangerous at night, when the human body should be recovering from daytime temperatures; prolonged exposure is linked to disturbed sleep, cardiovascular strain and higher death rates during heatwaves, with the very old and the very young at greatest risk. The costs are financial as well. Peak demand for electricity climbs steeply as residents switch on cooling equipment, which raises the risk of power failure precisely when the grid is most needed, and studies of office work have recorded measurable declines in productivity once indoor temperatures pass the mid-twenties." },
      { label: "C", p: "The most direct remedy is to reflect sunlight rather than absorb it. Painting roofs white or coating them with reflective membranes raises what engineers call the albedo — the proportion of solar energy a surface bounces back — and field trials in several hot cities have reported reductions of two to three degrees in peak air temperature across whole neighbourhoods. The approach has limits. In cold climates the same bright surfaces reduce the heat a building gains in winter, pushing up heating bills, and dust and weathering gradually dull reflective coatings unless they are cleaned." },
      { label: "D", p: "Trees offer a different route. Their canopies shade surfaces before the sun reaches them, and through transpiration they release water vapour that cools the surrounding air, so a well-planted street can be noticeably cooler than an unshaded one nearby. Parks are cooler still, and their influence extends beyond their boundaries when breezes carry the benefit into adjacent blocks. Yet planting is slow, political and site-specific: a sapling needs decades to provide useful shade, mature roots can damage pipes, and in dry cities the irrigation a new urban forest requires may consume water that is needed elsewhere." },
      { label: "E", p: "A third family of solutions works on the shape of the city itself. Where planners have protected ventilation corridors — wide avenues, riverbanks and rail easements aligned with prevailing winds — cooler air from the coast or the surrounding hills can flow inland. Building orientation matters too: a street running east to west spends the day in shadow if buildings on both sides are tall enough, whereas exposed asphalt absorbs heat from morning to evening. Some rapidly growing cities have written airflow requirements into law, requiring developers to model the effect of a new tower on wind reaching the streets behind it before permission is granted." },
      { label: "F", p: "Heat, however, is not distributed evenly. Satellite mapping repeatedly shows that districts with abundant trees and private gardens are several degrees cooler than dense neighbourhoods a few streets away, and these differences often follow income. In cities where air-conditioning is uncommon, the gap becomes a matter of survival, which is why some municipal governments now publish the location of cooling centres and require landlords to provide shade or ventilation. Researchers are careful to point out that no single intervention solves the problem: reflective surfaces, vegetation, ventilation corridors and social policy operate on different timescales, and a city that adopts only the cheapest of them will simply move the heat elsewhere." }

      { label: "A", p: "A potato plant grown in a field spends most of its energy on leaves, stems and roots, and only a fraction on the tubers that farmers actually harvest. It also competes with weeds, is exposed to whatever weather arrives, and, crucially, can be re-infected with viruses carried by aphids that overwinter in nearby crops. Because potatoes are propagated not from true seed but from tubers, any virus present in a mother plant is passed directly to its offspring, and yields decline with each generation of re-use. This is why seed potato production has traditionally depended on cool, windy regions where aphid populations stay low, a geographical accident that has shaped the economics of the crop for a century." },
      { label: "B", p: "Aeroponics offers an escape from geography. In this system, plants are suspended with their roots enclosed in a dark chamber and are fed through a fine mist of water and dissolved nutrients, applied in short bursts every few minutes. Nothing touches the roots except air and droplets. The technique is not new — it was explored in the nineteenth century as a way of studying root growth, and later refined by researchers who needed to observe roots without digging them up — but its commercial application to seed potatoes is recent. The advantage for seed production is that the entire operation can be housed indoors, behind insect-proof screens, in a building that can be built anywhere, including close to the farms that need the seed." },
      { label: "C", p: "The biology that made the system attractive is straightforward. A potato plant can be grown from a small cutting taken from a virus-free parent that has been tested in a laboratory. Suspended in mist, the cutting does not need to produce a large tuber; instead, it grows many times the usual number of small tubers, each of which can be harvested, stored and planted. In trials, this multiplication has produced several times the harvest of conventional methods from the same floor area, and the small size of aeroponic tubers has turned out to be an advantage rather than a defect, because they can be planted without being cut, which reduces the risk of transferring disease through a shared knife." },
      { label: "D", p: "Set against these results are the costs. An aeroponic facility is a factory: it needs a sealed building, a pump that never fails, filters, sensors and a reliable supply of electricity and clean water, and skilled staff who can recognise a blockage or an infection before it spreads through a whole batch. When a misting nozzle clogs at night, roots can dry out within hours, and because the plants share one nutrient reservoir, a single contaminated batch can become a system-wide incident. Capital costs per square metre are therefore high, and the equipment demands maintenance schedules that smallholder cooperatives — the group most often named as beneficiaries — can rarely fund on their own." },
      { label: "E", p: "Independent assessments have generally been cautious. An analysis of published trials concluded that aeroponic seed production is technically proven for potatoes but that the economic case depends almost entirely on local prices for certified seed and on the reliability of the local electricity supply; where power is intermittent, the authors noted, a generator and fuel become part of the calculation and the advantage narrows sharply. Another review found that many reported yields came from small experimental units and that scaling to commercial volumes involves problems of airflow, temperature control and labour that trials do not reveal. Several institutions are responding by developing hybrid models in which aeroponic mini-tubers are produced centrally and then multiplied by farmers in the field, using the expensive technology only where it adds the most value." },

        band6: "The graph shows the percentage of household waste that was recycled in four countries from 2005 to 2020.\n\nIn general, all the countries increased their recycling. Germany was the highest and Brazil was the lowest, but Brazil grew very fast.\n\nGermany started at 46% and went up to 69% in 2020. It was always first. The UK began at 23% and increased to 45%. Most of this growth happened before 2015, then it was almost the same.\n\nJapan stayed around 20% for all the period. It went from 20% to 22% only. Brazil had 4% in 2005 and this number became 18% in 2020. This is more than four times.\n\nSo recycling is more popular everywhere, and the difference between Germany and Brazil is smaller at the end.",
        band7: "The line graph illustrates the proportion of household waste recycled in Germany, the United Kingdom, Japan and Brazil over a fifteen-year period from 2005 to 2020.\n\nOverall, recycling rates increased in all four countries, although the pace of change varied considerably. Germany remained the strongest performer throughout, while Brazil, despite starting from a very low base, recorded the fastest relative growth.\n\nGermany and the United Kingdom both followed an upward trend. Germany's rate rose steadily from 46% in 2005 to 69% by 2020, with the sharpest increase occurring before 2010. The UK showed a similar but more dramatic pattern early on, climbing from 23% to 40% in just five years; after that, growth levelled off and the figure reached only 45% by 2020.\n\nBy contrast, Japanese recycling barely changed, hovering between 20% and 22% across the whole period. Brazil, however, more than quadrupled its rate, from 4% in 2005 to 18% in 2020. Interestingly, this rapid proportional growth did not close the gap with Germany: because Brazil began from such a low base, the difference between the two countries actually widened from 42 percentage points in 2005 to 51 by 2020.",
        band8: "The graph compares household recycling rates in four countries between 2005 and 2020.\n\nWhat stands out is that, while every country improved, the improvements were of two quite different kinds: mature systems such as Germany's made steady incremental gains, whereas Brazil's rate roughly quadrupled from a very low starting point. Germany led throughout, and Japan's rate hardly moved, so the four countries ended the period both more similar in ranking and still far apart in absolute terms.\n\nGermany's figure climbed consistently, from 46% to 69%, with the steepest growth between 2005 and 2010. The United Kingdom followed a comparable trajectory but ran out of momentum: having risen from 23% to 40% in the first five years, it added only five percentage points over the following decade and finished at 45%.\n\nAt the other end of the scale, Japan's rate fluctuated narrowly around one fifth of household waste, ending almost exactly where it began at 22%. Brazil, in contrast, lifted its rate from 4% to 18% — a fourfold increase — although its 2020 figure was still well below Germany's level twenty years earlier, which indicates how much distance remains despite such rapid relative progress.",

        band6: "The diagram explains how a desalination plant makes drinking water from sea water.\n\nFirst, sea water comes into the plant through an intake. Big pieces of rubbish are stopped by screens. After this, chemicals are put in the water and the particles go down to the bottom.\n\nNext, the water goes to high pressure pumps. The pressure is about 60 bar. Then the water passes through reverse osmosis membranes. The fresh water goes through the membrane but the salt does not, so brine is left. This brine is sent back to the sea through a diffuser.\n\nAfter that, minerals are added and the water is cleaned with disinfectant. Finally the water is kept in tanks and then it is distributed to houses. So there are eight main steps from sea water to drinking water.",
        band7: "The diagram illustrates the sequence of stages by which drinking water is produced from seawater in a coastal desalination plant.\n\nOverall, the process consists of eight principal stages, beginning with the intake of seawater and ending with distribution to households. Two by-products are produced and disposed of along the way: large debris and brine.\n\nIn the first stage, seawater is drawn into the plant through an intake, where screens remove large pieces of debris. The water then undergoes pre-treatment, during which chemicals are added and suspended particles are allowed to settle. Once the water has been cleaned in this way, it is forced through high-pressure pumps, which raise the pressure to approximately 60 bar.\n\nAt the centre of the process, the pressurised water passes through reverse-osmosis membranes. Fresh water is able to pass through these membranes, whereas salt and other impurities cannot, and the concentrated brine that remains is returned to the sea through a diffuser. Following this, the water is post-treated: minerals are added and the supply is disinfected. Finally, the treated water is stored in tanks before being distributed to households.",

      difficulty: "advanced", band: "7.0–7.5",
      timeMinutes: 40, minWords: 250,
      prompt: "Some people believe that governments should not spend public money on the arts, such as museums and theatres, and that this funding should be directed to healthcare and education instead.\n\nTo what extent do you agree or disagree with this view?",

      examinerNotes: {

      samples: {
        band6: "Today many people think the government should not give money to museums and theatres, and should spend it on hospitals and schools. I agree with this idea but only partly.\n\nFirst, healthcare and education are very important and they are more necessary than art. If a person is ill, a painting cannot help them. Also, schools need money for teachers and books. So I understand why people say arts funding is a waste.\n\nHowever, I think art is also important for society. Museums and theatres teach children about culture and history. If the government stops paying for them, the tickets will be very expensive and only rich people can enjoy them. This will make society more unfair. Also, in my country many tourists come to see museums, so this brings money to the economy.\n\nIn conclusion, I agree that healthcare and education must be the priority, but I do not agree that arts funding should stop completely. The government should spend less on art, but not zero.",
        band7: "It is sometimes argued that governments should stop funding cultural institutions such as museums and theatres, directing the money to healthcare and education instead. While I accept that health and schooling must take priority, I believe that a complete withdrawal of arts funding would be a mistake.\n\nThe argument for redirecting money is understandable. Hospitals and schools provide services that no private market can supply fairly, and their outcomes — life expectancy, literacy, employment — are measurable. When budgets are tight, spending on museums can look like a luxury. This logic is valid as far as it goes, but it overlooks two things. First, arts subsidy typically represents less than one per cent of public spending, so cancelling it would not solve the funding problems of hospitals or schools. Second, cultural institutions generate tourism income that itself supports public services.\n\nA stronger case can be made for keeping public funding in place. Museums preserve a nation's history and make it available to everyone, not only to those who can pay. If admission were set by the market, tickets would rise to whatever wealthier visitors could afford, and access for low-income families and school groups would disappear. Theatres and galleries also support the creative economy, providing employment and skills that feed into related sectors, including the media and design industries that health and education systems rely on for training materials and public information.\n\nIn conclusion, although healthcare and education clearly deserve the largest share of public spending, cutting arts funding altogether would be short-sighted. A reduced but protected subsidy would preserve access and long-term cultural value while leaving the bulk of the budget where it is most urgently needed.",
        band8: "The suggestion that public money should be diverted from the arts towards healthcare and education raises a question not of value but of priority. I largely disagree with the proposal, though I accept that health and education must remain the first claims on any government's budget.\n\nThose who favour redirection rest their case on necessity. Healthcare and schooling are statutory obligations with measurable outcomes, and no market can distribute them fairly; cultural institutions, by contrast, may appear to be discretionary. There is some force in this, but the argument contains two weaknesses. The sums involved are not comparable — arts and culture typically account for a fraction of one per cent of public expenditure — so withdrawal would be an act of symbolism rather than a solution. Moreover, that fraction purchases cultural infrastructure whose benefits are systemic rather than immediate: museums educate schoolchildren, and the creative industries they sustain generate tax revenue that helps pay for hospitals.\n\nMy own objection goes further. Public arts funding exists precisely because markets under-supply cultural goods that have value beyond their price. If institutions such as regional museums were left to the market, admission would be priced for those able and willing to pay the most, and children from poorer families would lose the exposure that shapes later aspiration. National collections would be maintained as tourist attractions rather than as resources for citizens. This is not a hypothetical danger; where funding has been cut sharply elsewhere, opening hours have been reduced and school visits curtailed, which is a redistribution of cultural opportunity away from the least advantaged.\n\nThe most defensible policy, therefore, is neither protection at any cost nor wholesale withdrawal. Health and education should absorb the overwhelming majority of additional spending, while a modest, ring-fenced cultural budget preserves access and long-term public value.",
        band9: "Few budget debates are framed as starkly as this one, and few are as misleadingly framed. The choice presented — subsidise museums, or treat sick children — invites a moral answer to what is in fact an arithmetic question. I disagree with the proposal, not because the arts outrank healthcare, but because the trade-off it describes barely exists and the principle behind it is unsound.\n\nThe arithmetic is straightforward. Cultural subsidy in most developed economies amounts to well under one per cent of public expenditure; in some it is closer to a rounding error. Cancelling it would not fund a single large hospital for a year. If the objective is to strengthen health and education, arts budgets are not where the money is, and targeting them signals seriousness without delivering it. That a policy is symbolically satisfying is not evidence that it is effective.\n\nThe principle is more troubling still. Public funding of culture exists because markets allocate cultural goods efficiently but not fairly: they supply whatever the wealthiest consumers will pay for, and neglect what everyone benefits from knowing. A national collection, a public archive or a subsidised theatre for children is not a private good; it is infrastructure for shared memory and shared aspiration. Priced purely by the market, such institutions do not vanish — they stratify, offering spectacle to tourists and denying participation to citizens.\n\nThis is why the sensible division of responsibility is not between culture and care but between what must be universal and what must remain accessible. Healthcare and education are rightly universal, and no serious advocate of the arts would dispute their priority. Culture is rightly accessible — modestly subsidised so that access does not depend on income. To abandon the second in order to make a gesture towards the first would be to damage one public good without materially improving the other, which is the least defensible form of fiscal policy."

      prompt: "Some people argue that the growth of remote working benefits society, while others believe it damages cities, workplaces and personal development.\n\nDiscuss both these views and give your own opinion.",
      modelPlan: [

        LR: "Topic vocabulary: commuting time, labour mobility, spontaneous interaction, mentoring, urban regeneration, discretionary spend.",

      },
      samples: {
        band6: "Nowadays many people work from home because of the internet. Some people think this is good for society and other people think it is bad. In this essay I will discuss both sides and give my opinion.\n\nOn one hand, remote work has many advantages. Workers do not need to travel to the office every day, so they save time and money. This is good for the environment because there are fewer cars. Also, people who live far from big cities can get good jobs, so small towns can grow.\n\nOn the other hand, there are problems. If everyone works at home, the city centre shops and cafes lose customers and they close. Companies also lose creativity because colleagues do not meet and talk. New employees cannot learn from older colleagues. Finally, some people work too much at home because there is no clear end of the day.\n\nIn my opinion, remote work is mostly a good thing but companies must organise it carefully. A mix of home and office days is the best solution.",
        band7: "The shift towards remote working has divided opinion. Supporters see it as a liberation of both workers and regions, while critics warn that it erodes cities and undermines professional development. In my view, the benefits are real but they depend almost entirely on how the arrangement is managed.\n\nThose who welcome remote work emphasise its practical gains. Employees save hours of commuting each week and can choose where to live, which spreads opportunity to smaller towns and reduces pressure on expensive urban housing. There are social gains too: parents and disabled workers find the labour market far more accessible when physical attendance is not compulsory, and lower commuting volumes reduce transport emissions.\n\nThe objections deserve equal attention. City-centre businesses that depend on office workers — cafes, shops, transport providers — have suffered where large employers have reduced attendance, and the tax base that funds public services weakens with them. More subtly, workplaces lose the informal contact from which ideas and trust develop; junior employees in particular miss the mentoring that happens in corridors rather than in scheduled meetings. Working from home can also blur the boundary between work and rest, which may explain the rise in reported exhaustion among some remote staff.\n\nOn balance, I am persuaded that the benefits outweigh the drawbacks, but only under two conditions. First, attendance should be organised rather than random: teams benefit from being together on the same days. Second, offices should be redesigned for collaboration rather than for individual desk work, which can be done anywhere. Remote working is not in itself destructive to cities or careers; unsupervised remote working can be.",
        band8: "Remote work has moved within a decade from an occasional accommodation to a routine arrangement in many economies, and the debate about its consequences has kept pace. Advocates present it as a democratising force; sceptics depict it as a solvent of cities and careers. The truth, I would argue, lies less in the technology than in the management around it.\n\nThe case for remote work rests on demonstrable efficiency gains. Commuting is unpaid labour, and its removal returns time to households while cutting transport emissions — two benefits that no employer could plausibly generate by other means. Geography also loosens its grip: workers who cannot relocate can nonetheless compete for urban salaries, and small towns gain residents with urban incomes, which supports local services.\n\nCritics make three objections, of unequal strength. The weakest is that productivity falls; the evidence on this is mixed and strongly conditioned by the nature of the work. The second — the hollowing-out of city centres — is real but narrower than it appears, since dense residential populations also sustain urban commerce, and many cities are adapting by converting offices into housing. The third is the most serious: the erosion of the informal transmission of skill and culture within organisations. A junior lawyer or engineer learns far more from overheard negotiations and unplanned questions than from a well-structured video call, and no technology reproduces that adequately.\n\nMy own position is therefore qualified but clear. Remote working should be embraced as a normal mode of operation, not as the default one. Organisations that require a few shared days in which teams are physically together preserve the social capital that remote arrangements deplete, while individuals retain the autonomy that makes the arrangement attractive. The danger lies not in remote work itself but in treating offices and schedules as matters of individual preference, when they are in fact collective infrastructure.",
        band9: "Whether remote working enriches or impoverishes a society is one of those questions that appears to demand a verdict and is better answered by asking a second question: remote working, arranged how? The evidence assembled over the past decade resists a general conclusion because the variable that matters is not location but coordination.\n\nTaken at face value, the optimists have the easier case. Commuting consumes an unpaid hour or more of most urban working days, and its costs fall regressively on those with the least flexibility in housing. Remove the requirement to be present, and labour markets widen: carers, disabled workers and residents of peripheral regions acquire access they previously lacked, while towns that were exporting their young people begin to retain them. Few policy instruments deliver so much for so little public money.\n\nYet the sceptics' objections are not nostalgic. Urban centres are fiscal entities as well as cultural ones: when occupancy falls, the commercial and property taxes that fund services contract, and the shops that make city life attractive close in sequence. Within organisations, the subtler loss is tacit knowledge — the skills transferred by proximity rather than instruction, and the incidental trust on which later collaboration depends. Neither loss appears in productivity statistics until it has already occurred.\n\nWhat follows from this is not a choice between two positions but a design problem. The arrangement that captures the gains and contains the losses is a deliberately synchronised one: teams co-located for the days when shared work is created and reviewed, and dispersed when the work is individual. Offices would then function as the places where thinking is done together rather than the places where emails are answered. Cities, meanwhile, must accept that their centres will be less exclusively commercial and plan accordingly. Remote working is neither a liberation nor a solvent; it is an opportunity whose consequences we largely choose."
      }

      samples: {
        band6: "Nowadays many students study at a university in another city and they do not live with their family. In my opinion this has more advantages than disadvantages.\n\nThe first advantage is independence. When students live alone, they must cook, clean and manage their money. This helps them to become an adult. Also, they meet many different people from different places, so they learn about other cultures. This is very useful for their future job too, because they make friends and contacts.\n\nHowever, there are some disadvantages. Living away from home is expensive. Students pay rent, food and transport, so they need a part-time job and this takes time from study. Some students feel lonely and stressed, especially in the first year, because their family is far away.\n\nIn conclusion, I think the advantages are bigger. But universities should help students with cheap housing and counselling, so the disadvantages are smaller.",
        band7: "Studying at a university away from home has become the norm in many countries, and the question of whether this benefits students more than it costs them is a reasonable one. I would argue that the advantages clearly outweigh the disadvantages, especially in the long term.\n\nThe strongest advantage is the development of independence. Managing a household, a budget and a timetable without parental supervision forces young people to take responsibility, and these skills persist long after graduation. A second benefit is social range: students who move away encounter people from different regions and backgrounds, which broadens their outlook and, in professional terms, their network of contacts.\n\nAgainst this, the financial and emotional costs are real. Rent and living expenses in university cities are often high, and many students take part-time work that competes with study time; in some cases, the debt accumulated has consequences for years afterwards. There is also a well-documented risk of loneliness, particularly in the first year, when established friendships have been left behind.\n\nIn my view, these disadvantages are serious but they are largely temporary and can be mitigated. Universities can provide affordable accommodation, counselling and structured social activities, while grants reduce the financial pressure. The benefits of independence, by contrast, are cumulative and last a lifetime. For this reason, the advantages outweigh the disadvantages.",
        band8: "Leaving home to study is treated in many societies as a rite of passage, yet it also places a substantial financial and psychological burden on young people at precisely the moment they are least equipped to carry it. On balance, I judge the advantages to outweigh the disadvantages, though not by as wide a margin as is usually assumed.\n\nThe case for moving away rests on two durable gains. The first is functional: students who live independently acquire skills — budgeting, cooking, negotiating with landlords — that a supervised home does not teach, and research on graduate outcomes repeatedly links such self-management to later career resilience. The second is social. A university city concentrates people from different regions and social classes into a single environment, and the networks formed there shape employment opportunities for decades afterwards.\n\nThe costs, however, are not trivial. Housing in university cities is often the most expensive accommodation a young person will ever rent per square metre, and the pressure to work part-time frequently reduces the hours available for study — a burden that falls hardest on students from low-income families, for whom the alternative of living at home is often a financial necessity rather than a preference. Mental-health services in university towns report particular strain in the first year, when support networks are at their weakest.\n\nWhat makes the balance favourable is not that the costs are small but that they are addressable. Targeted grants, guaranteed affordable housing and early pastoral support can remove much of the sting, whereas the independence and networks gained cannot be acquired any other way. The advantages therefore outweigh the disadvantages, provided societies are willing to absorb the transitional costs that make them possible.",
        band9: "The question of whether students gain or lose by leaving home invites a false symmetry. Advantaged students gain almost everything and risk almost nothing; disadvantaged students may gain the same freedoms while risking financial failure. The aggregate verdict — that the advantages outweigh the disadvantages — is therefore true but unhelpful unless it is qualified by who pays the price.\n\nThree advantages are well established. Living independently converts a young person from a dependent into a householder, which accelerates maturity in a way no curriculum can. Proximity to a university's social and professional density multiplies contacts, and contacts translate into opportunity. And distance from a familiar environment, uncomfortable though it is, reliably loosens the assumptions people inherit, which is arguably the principal intellectual benefit of higher education.\n\nThe disadvantages cluster differently. Their financial intensity is concentrated in a subset of students: those without family reserves, who absorb the risk of high urban rents through part-time work that displaces study, or through debt that constrains their later choices. Psychologically, the first year exposes students to isolation at the very moment their longest-standing friendships end, and universities compound the problem by treating mental-health support as an ancillary service rather than core infrastructure.\n\nMy verdict, then, is conditional rather than absolute: the advantages outweigh the disadvantages for those whose institutions and governments have made independent study affordable and supported, and they do not for those who must improvise. The policy conclusion follows directly — a country that expects students to leave home should expect itself to fund the transition, since the evidence suggests the investment pays for itself many times over in graduate capability.",
      }

var Validator = {
  run: function () {
    var rep = { checked: 0, errors: [], warnings: [], byType: {}, byDifficulty: {}, bySkill: {}, coverage: {} };
    var ids = {};
    Bank.items.forEach(function (it) {
      rep.checked++;
      rep.byType[it.type] = (rep.byType[it.type] || 0) + 1;
      rep.byDifficulty[it.difficulty] = (rep.byDifficulty[it.difficulty] || 0) + 1;
      rep.bySkill[it.skill] = (rep.bySkill[it.skill] || 0) + 1;
      if (ids[it.id]) rep.errors.push("Duplicate question id: " + it.id);
      ids[it.id] = 1;
      if (!it.prompt || String(it.prompt).length < 8) rep.errors.push(it.id + ": prompt too short");
      if (it.answer == null || String(it.answer).length === 0) rep.errors.push(it.id + ": missing answer key");
      var completionTypes = ["SENTCOMP", "SUMMARY", "NOTE", "FORM", "TABLE", "FLOWCHART", "SHORTANS", "DIAGRAM"];
      var isCompletion = completionTypes.indexOf(it.type) > -1;
      if (isCompletion && (!it.accepted || !it.accepted.length)) rep.warnings.push(it.id + ": completion item with no alternative answers listed");
      if (isCompletion && it.wordLimit) {
        var WORDNUM = { ONE: 1, TWO: 2, THREE: 3, FOUR: 4, FIVE: 5 };
        var lm = /\b(ONE|TWO|THREE|FOUR|FIVE|\d+)\s+WORDS?\b/i.exec(it.wordLimit);
        var lim = lm ? (WORDNUM[lm[1].toUpperCase()] || parseInt(lm[1], 10)) : 0;
        if (lim && countWords(it.answer) > lim) rep.errors.push(it.id + ": answer '" + it.answer + "' exceeds its own word limit (" + lim + ")");
        (it.accepted || []).forEach(function (a) {
          if (lim && countWords(a) > lim) rep.errors.push(it.id + ": accepted alternative '" + a + "' exceeds the word limit (" + lim + ")");
        });
      }
      var ex = it.ex || {};
      ["test", "where", "quote", "why", "mine", "trap", "next"].forEach(function (k) {
        if (!ex[k] || String(ex[k]).length < 10) rep.errors.push(it.id + ": explanation field '" + k + "' missing/incomplete");
      });
      if (it.options && it.options.length < 3) rep.errors.push(it.id + ": too few options");
      var optList = (it.options && it.options.length) ? it.options : parseOptionsFromPrompt(it.prompt);
      if (optList && optionStyle(optList) !== "text") {
        if (optionIndexOf(it.answer, optList) === -1) rep.errors.push(it.id + ": answer '" + it.answer + "' cannot be matched to any option");
      }
      /* single intended answer unless alternatives declared */
      var set = {}; [it.answer].concat(it.accepted || []).forEach(function (a) { set[normaliseAnswer(a)] = 1; });
      if (!it.options && Object.keys(set).length > 4) rep.warnings.push(it.id + ": many accepted forms — check key clarity");
      /* evidence present in context text */
      var ctxText = "";
      if (it.ctxType === "passage") ctxText = (it.ctx.text || []).map(function (p) { return p.p; }).join(" ");
      else if (it.ctxType === "section") ctxText = (it.ctx.transcript || []).map(function (l) { return l.line; }).join(" ");
      var keyWord = String(it.answer).split(" ").sort(function (a, b) { return b.length - a.length; })[0].replace(/[^a-z0-9]/gi, "").toLowerCase();
      if (isCompletion && ctxText && keyWord.length > 2 && ctxText.toLowerCase().indexOf(keyWord) === -1) {
        var alt = (it.accepted || []).some(function (a) { return ctxText.toLowerCase().indexOf(String(a).toLowerCase().split(" ")[0]) > -1; });
        if (!alt) rep.warnings.push(it.id + ": answer word '" + keyWord + "' not found in the source text (check paraphrase)");
      }
    });
    rep.coverage.readingTypes = Bank.typesBy("reading").length;
    rep.coverage.listeningTypes = Bank.typesBy("listening").length;
    rep.coverage.passages = (window.BANK_READING.academic || []).length + (window.BANK_READING.general || []).length;
    rep.coverage.sections = (window.BANK_LISTENING.sections || []).length;
    rep.coverage.writingTasks = (window.BANK_WRITING.tasks || []).length;
    rep.coverage.speakingSets = (window.BANK_SPEAKING.sets || []).length;
    rep.coverage.vocabWords = (window.BANK_VOCAB.words || []).length;

  }

var Analytics = {
  objective: function () { return Store.get().attempts.filter(function (a) { return a.skill !== "writing" && a.skill !== "speaking"; }); },
  skillAttempts: function (skill) { return Store.get().attempts.filter(function (a) { return a.skill === skill; }); },
  /** Recency-weighted band for a skill (last 5 attempts, newest weighted most). */
  skillBand: function (skill) {
    var a = Store.get().attempts.filter(function (x) { return x.skill === skill && x.band; });
    if (!a) return null;
    var recent = a.slice(-6);

    return den ? round1(num / den) : null;
  },
  bands: function () {

  typeAccuracy: function (skill) {

      /* vocabulary + grammar */
      tasks.push({ skill: "vocabulary", text: "Vocabulary — " + (d % 3 === 0 ? "save 10 new words from today's reading" : "20 due words (spaced repetition)"), min: 12 });
      if (d % 2 === 1) tasks.push({ skill: "grammar", text: "Grammar — " + (Analytics.grammarErrors()[0] ? Analytics.grammarErrors()[0].category : "articles & prepositions") + " exercise set", min: 10 });
      if (d % 7 === 5) tasks.push({ skill: "mock", text: "Full practice test day — Reading + Listening under exam timing", min: 90 });
      if (d % 7 === 6) tasks.push({ skill: "review", text: "Review day — re-read every wrong answer explanation from this week", min: Math.round(minutes * 0.5) });
      plan.push({ day: d + 1, date: date.toISOString().slice(0, 10), focus: focusSkill, tasks: tasks, totalMin: tasks.reduce(function (a, t) { return a + t.min; }, 0) });
    }
    return plan;
  },
  save: function (plan) {
    var s = Store.get();
    s.plan = { generatedAt: Date.now(), days: plan, done: s.plan.done || {} };
    Store.save();
  }
};

/* ================ 06-sets.js ================ */
/* =========================================================================
   IELTS MASTERY — PRACTICE SETS
   A catalogue of 20 numbered, selectable practice sets for each skill
   (Reading · Listening · Writing · Speaking). Every set is reproducible:
   set #7 always contains the same questions, so a score means something
   and can be compared across attempts.

   • Reading / Listening sets  → real IELTS part format: whole passage(s) /
     whole section(s) with their own question groups, under a time limit.
   • Writing sets              → one task each, plus three full Task 1 + 2
     papers at the end of the list.
   • Speaking sets             → full three-part interviews, plus cue-card and
     Part 3 discussion drills.

   Scoring is not recomputed here — sets are handed to the normal runner,
   which scores them, logs an attempt tagged with the set key, and returns
   the student to the catalogue with the score attached to the card.
   ========================================================================= */
var PracticeSets = (function () {
  var PER_SKILL = 20;

  /* ---- deterministic helpers (same set number → same questions) ---- */
  function hash(str) {
    var h = 2166136261, i;
    for (i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, seed) {
    var r = rng(seed), a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(r() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /* ---- objective (reading / listening) helpers ---- */
  function moduleFor(skill) {
    return skill === "listening" ? "academic" : (Store.get().profile.module || "academic");
  }
  function contextsFor(skill, module) {
    if (skill === "listening") return (window.BANK_LISTENING.sections || []).slice();
    return (window.BANK_READING[module] || []).slice();
  }
  function mkItem(ctx, q, skill, module, ctxType) {
    return {
      id: ctx.id + "-" + q.n, skill: skill, module: module, ctxId: ctx.id, ctxType: ctxType,
      ctx: ctx, number: q.n, type: q.type, prompt: q.q, options: q.options || null, wordLimit: q.wordLimit || "",
      answer: q.answer, accepted: q.accepted || [], ex: q.ex, difficulty: q.diff || ctx.difficulty,
      bandLevel: q.bandLevel || ("Band " + ctx.band), topic: ctx.topic || ctx.context,
      source: ctx.title || ctx.context
    };
  }
  function setSize(skill) { return skill === "listening" ? 20 : 20; }
  /** Context order for one set: the anchor passage/section rotates with the set
     number (so sets 1,2,3 start on different material), then the remaining
     contexts follow in a seeded order that varies per set. */
  function orderedContexts(skill, module, n) {
    var ctxs = contextsFor(skill, module);
    if (!ctxs.length) return [];
    var anchor = (n - 1) % ctxs.length;
    var rest = seededShuffle(ctxs.filter(function (_, i) { return i !== anchor; }), hash("rest:" + skill + ":" + module + ":" + n));
    return [ctxs[anchor]].concat(rest);
  }
  function setMinutes(skill, count) { return Math.max(10, Math.round(count * (skill === "listening" ? 1.1 : 1.4))); }

  /** Build the objective test object for (skill, n). Deterministic in n. */
  function buildObjective(skill, n) {
    var module = moduleFor(skill);
    var ctxs = contextsFor(skill, module);
    if (!ctxs.length) return null;
    var size = setSize(skill);
    var ordered = orderedContexts(skill, module, n);
    var items = [], used = [], i, k;
    for (i = 0; i < ordered.length && items.length < size; i++) {
      var c = ordered[i], qs = c.questions || [], need = size - items.length, take;
      if (!qs.length) continue;
      if (i === 0) {
        /* the anchor passage/section is used whole — a proper IELTS part */
        take = qs.slice(0, need);
      } else {
        /* after that, a seeded spread of questions from the next context, kept
           in passage order, so two sets over the same material still differ */
        var pick = seededShuffle(qs, hash("pick:" + skill + ":" + n + ":" + c.id)).slice(0, need);
        take = qs.filter(function (q) { return pick.indexOf(q) > -1; });
      }
      if (!take.length) continue;
      used.push(c);
      for (k = 0; k < take.length; k++) items.push(mkItem(c, take[k], skill, module, skill === "listening" ? "section" : "passage"));
    }
    var types = {}, typeList = [];
    items.forEach(function (it) { if (!types[it.type]) { types[it.type] = 0; typeList.push(it.type); } types[it.type]++; });
    var band = items.reduce(function (a, it) { return Math.max(a, bandNum(it.bandLevel)); }, 0);
    return {
      id: "set-" + (skill === "reading" ? "R" : "L") + "-" + n,
      mode: "set", skill: skill, module: module, setKey: keyFor(skill, n), setNumber: n,
      title: (skill === "reading" ? "Reading" : "Listening") + " Set " + n,
      items: items, contexts: used, timed: true,
      durationSec: setSize(skill) * (skill === "listening" ? 55 : 80),
      meta: {
        count: items.length, minutes: setMinutes(skill, items.length),
        types: typeList, topBand: band,
        parts: used.map(function (c) { return c.title || c.context; })
      }
    };
  }

  /* ---- writing sets ---- */
  function writingSets() {
    var tasks = window.BANK_WRITING.tasks || [];
    var t1 = tasks.filter(function (t) { return t.task === 1; });
    var t2 = tasks.filter(function (t) { return t.task === 2; });
    return { tasks: tasks, t1: t1, t2: t2 };
  }
  function writingDescriptor(n) {
    var w = writingSets(), tasks = w.tasks;
    if (n <= tasks.length) {
      var t = tasks[n - 1];
      return {
        key: keyFor("writing", n), skill: "writing", n: n, kind: "writing",
        title: "Writing Set " + n, subtitle: t.title, taskIds: [t.id],
        format: "Task " + t.task + " · " + (t.visualType || t.essayType || (t.formal === false ? "Informal letter" : "Formal letter")) +
          " · " + t.timeMinutes + " min · " + t.minWords + "+ words",
        tone: t.task === 1 ? "teal" : "violet"
      };
    }
    var idx = n - tasks.length - 1;
    var a = w.t1.length ? w.t1[idx % w.t1.length] : null;
    var b = w.t2.length ? w.t2[idx % w.t2.length] : null;
    return {
      key: keyFor("writing", n), skill: "writing", n: n, kind: "writing",
      title: "Writing Set " + n + " — full paper",
      subtitle: (a ? a.title : "Task 1") + " → " + (b ? b.title : "Task 2"),
      taskIds: [a, b].filter(Boolean).map(function (t) { return t.id; }),
      format: "Task 1 + Task 2 · 60 min · 400+ words", tone: "amber"
    };
  }

  /* ---- speaking sets ---- */
  function speakingDescriptor(n) {
    var sets = window.BANK_SPEAKING.sets || [];
    if (n <= sets.length) {
      var s = sets[n - 1];
      return {
        key: keyFor("speaking", n), skill: "speaking", n: n, kind: "speaking",
        title: "Speaking Set " + n, subtitle: s.part1Topic, setId: s.id, mode: "full",
        format: "Part 1 + Part 2 + Part 3 · ~14 min", tone: "green"
      };
    }
    var idx = n - sets.length - 1;
    var sp = sets[idx % sets.length];
    var mode = idx % 2 === 0 ? "part2" : "part3";
    return {
      key: keyFor("speaking", n), skill: "speaking", n: n, kind: "speaking",
      title: "Speaking Set " + n + (mode === "part2" ? " — cue card drill" : " — Part 3 drill"),
      subtitle: sp.part1Topic, setId: sp.id, mode: mode,
      format: mode === "part2" ? "Part 2 cue card · 1 min prep + 2 min talk" : "Part 3 discussion · ~5 min",
      tone: "teal"
    };
  }

  function keyFor(skill, n) {
    return (skill === "reading" ? "RS" : skill === "listening" ? "LS" : skill === "writing" ? "WS" : "SS") + "-" + n;
  }
  function skillFor(key) {
    var p = String(key || "").split("-")[0];
    return p === "RS" ? "reading" : p === "LS" ? "listening" : p === "WS" ? "writing" : p === "SS" ? "speaking" : null;
  }

  /** Descriptor for an objective set — mirrors the built test exactly. */
  function objectiveDescriptor(skill, n) {
    var t = buildObjective(skill, n);
    if (!t) return null;
    var m = t.meta;
    return {
      key: keyFor(skill, n), skill: skill, n: n, kind: "objective", module: t.module,
      title: (skill === "reading" ? "Reading" : "Listening") + " Set " + n,
      subtitle: m.parts.join("  ·  "),
      format: m.count + " questions · " + m.minutes + " min · " +
        (skill === "listening" ? m.parts.length + " section" + (m.parts.length > 1 ? "s" : "") : m.parts.length + " passage" + (m.parts.length > 1 ? "s" : "")),
      parts: m.parts.length, types: m.types, tone: skill === "reading" ? "teal" : "violet"
    };
  }

  /** Full descriptor (adds question-type chips for objective sets). */
  function descriptor(key) {
    var skill = skillFor(key);
    var n = parseInt(String(key || "").split("-")[1], 10);
    if (!skill || !n) return null;
    if (skill === "writing") return writingDescriptor(n);
    if (skill === "speaking") return speakingDescriptor(n);
    return objectiveDescriptor(skill, n);
  }

  /** 20 descriptors for one skill, in set order. */
  function catalog(skill) {
    var out = [], n;
    for (n = 1; n <= PER_SKILL; n++) {
      var d = skill === "writing" ? writingDescriptor(n)
        : skill === "speaking" ? speakingDescriptor(n)
          : objectiveDescriptor(skill, n);
      if (d) out.push(d);
    }
    return out;
  }

  /** Score history for one set, read from the attempt log. */
  function stats(key) {
    var at = Store.get().attempts.filter(function (a) { return a.setKey === key; });
    var bands = at.filter(function (a) { return a.band != null; });
    var last = at.length ? at[at.length - 1] : null;
    return {
      attempts: at.length,
      last: last, lastBand: last && last.band != null ? last.band : null,
      lastRaw: last ? last.raw : null, lastOutOf: last ? last.outOf : null,
      best: bands.length ? Math.max.apply(null, bands.map(function (a) { return a.band; })) : null,
      ts: last ? last.ts : null
    };
  }

  /** Summary across a skill's 20 sets, for the home-page block. */
  function summary(skill) {
    var cat = catalog(skill), done = 0, bands = [];
    cat.forEach(function (d) {
      var s = stats(d.key);
      if (s.attempts) done++;
      if (s.best != null) bands.push(s.best);
    });
    return { total: cat.length, done: done, best: bands.length ? Math.max.apply(null, bands) : null };
  }

  /** Launch the set described by key — used by the controller action. */
  function launch(key) {
    var d = descriptor(key);
    if (!d) { toast("That set could not be loaded."); return; }
    if (d.kind === "objective") {
      var t = buildObjective(d.skill, d.n);
      if (!t) { toast("Not enough material in the bank for that set yet."); return; }
      App.launchTest(t);
      return;
    }
    if (d.kind === "writing") {
      var tasks = (window.BANK_WRITING.tasks || []).filter(function (x) { return d.taskIds.indexOf(x.id) > -1; });
      if (!tasks.length) { toast("That writing task could not be loaded."); return; }
      Act.openWriting(tasks[0], { setKey: d.key, paper: d.taskIds, paperIndex: 0 });
      return;
    }
    var sets = (window.BANK_SPEAKING.sets || []).filter(function (x) { return x.id === d.setId; });
    if (!sets.length) { toast("That speaking set could not be loaded."); return; }
    Act.startSpeaking({ set: sets[0], mode: d.mode, setKey: d.key });
  }

  function nextKey(key) {
    var skill = skillFor(key);
    var n = parseInt(String(key || "").split("-")[1], 10);
    if (!skill || !n) return null;
    return keyFor(skill, n >= PER_SKILL ? 1 : n + 1);
  }

  return {
    PER_SKILL: PER_SKILL,
    catalog: catalog, descriptor: descriptor, build: buildObjective,
    stats: stats, summary: summary, launch: launch, nextKey: nextKey,
    keyFor: keyFor, skillFor: skillFor
  };
})();
